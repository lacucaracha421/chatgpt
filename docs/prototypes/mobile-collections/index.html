<!--
  Throwaway prototype (2026-09-23): Collections redesigned with the same principles as the
  browse-first Library (one title bar, segments, inline search, chips + bottom sheets,
  continuous scrolling, pull to refresh). Fixture data only; no network or app code.

<style>

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:15px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation;text-align:left}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
h1,h2,h3,p,dl,dd{margin:0}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.stage{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}

}
.top{height:var(--top);min-height:var(--top);display:flex;align-items:center;gap:6px;padding:0 calc(var(--gutter) - 10px);background:var(--bg);position:relative;z-index:3}
.top.root{padding-left:var(--gutter)}
.top h1{font-size:22px;font-weight:600;flex:1;min-width:0}

.titles{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.titles h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.seg button .num{font-size:13px;opacity:.8}

.find{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border:1px solid var(--border);border-radius:4px;color:var(--muted);margin-bottom:20px}
.find input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text)}
.find input::placeholder{color:var(--muted)}
.find button{width:36px;height:36px;display:grid;place-items:center}
.section{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;min-height:28px}
.section h2{font-size:15px;font-weight:600}
.section h2 .num{color:var(--muted);font-weight:500;margin-left:6px}
.section .more{display:flex;align-items:center;gap:2px;color:var(--muted);font-size:13px;min-height:36px}
.section .more svg{width:16px;height:16px}
.fold{display:flex;align-items:center;gap:6px;min-height:40px}

.chip.on{background:var(--chip);border-color:var(--chip-border)}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 12px}

.grid.big{grid-template-columns:repeat(2,minmax(0,1fr))}

.work{display:flex;flex-direction:column;min-width:0}

.cover{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;border-radius:2px;background:var(--surface)}

.av .cover{aspect-ratio:5/7}

.coverset span{display:block;font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap}
.work b{font-weight:500;font-size:14px;line-height:1.35;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:8px}

.block{margin-top:26px}
.editions{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.volumes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 10px}

.episodes{margin-top:12px}
.ep{display:grid;grid-template-columns:32px 1fr;gap:2px 8px;padding:10px 0;border-bottom:1px solid var(--border)}

.ep small{color:var(--muted);font-size:12px}
.info{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14px}
.info dt{color:var(--muted)}
.overview{color:var(--text);opacity:.9;line-height:1.6;max-width:65ch}
.overview.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.textbtn{color:var(--muted);font-size:13px;min-height:36px;margin-top:2px}

.nav{height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:center;background:var(--bar);border-top:1px solid var(--border)}
.nav button{flex:1;max-width:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);position:relative}
.nav button[aria-current=page]{color:var(--text)}
.nav button[aria-current=page]::before{content:"";position:absolute;top:0;width:28px;height:2px;background:var(--accent)}

.scrim{position:fixed;inset:0;background:rgba(7,10,15,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(560px,100%);max-height:80%;overflow-y:auto;background:var(--surface);border-radius:8px 8px 0 0;padding:8px 0 calc(12px + env(safe-area-inset-bottom))}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up var(--std) var(--ease)}@keyframes up{from{transform:translateY(40px);opacity:.6}}}
.grip{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 6px}
.sheet h2{font-size:16px;font-weight:600;padding:8px var(--gutter) 6px}
.sheet h3{font-size:12px;color:var(--muted);font-weight:500;padding:10px var(--gutter) 4px}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:50px;padding:0 var(--gutter)}
.opt:active{background:var(--pressed)}
.opt[aria-checked=true]{color:var(--accent);font-weight:600}
.opt .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--chip-border)}
.opt[aria-checked=true] .dot{border:5px solid var(--accent)}
.stars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:6px var(--gutter) 8px}
.stars button{height:44px;border:1px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;gap:4px}
.stars button[aria-checked=true]{background:var(--chip);border-color:var(--accent);color:var(--accent)}
.stars svg{width:13px;height:13px;fill:currentColor;stroke:none}

.viewer{position:fixed;inset:0;background:var(--viewer);z-index:30;display:flex;flex-direction:column}
.vbar{height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 6px 0;display:flex;align-items:center;gap:6px}
.vbar .grow{flex:1}
.vimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 12px 16px;position:relative}
.vimg img{max-width:100%;max-height:100%;object-fit:contain}
.vnav{position:absolute;top:0;bottom:0;width:24%;display:flex;align-items:center;color:transparent}
.vnav.l{left:0;padding-left:8px}.vnav.r{right:0;justify-content:flex-end;padding-right:8px}
@media (hover:hover){.vnav:hover{color:rgba(231,233,236,.8)}}
</style>
</head>

    score:rated?Math.round(rnd()*8+2)/2:null,added:n-k+Math.floor(rnd()*5),showcase:k%5===1||k===0,showOrder:k,
    platforms:t==='game'?['PC','PS5','Switch'][k%3]:null,genres:{game:'어드벤처 · 퍼즐',manga:'드라마 · 일상',movie:'드라마'}[t],publisher:t==='manga'?'대원씨아이':t==='game'?'Annapurna':null,status:t==='movie'?(k%3?'완결':'방영 중'):t==='manga'?(k%4?'완결':'연재 중'):null,
    overview:'잔잔한 풍경 속에서 서로 다른 시간을 살아가는 사람들이 한 장소에 모여들며 벌어지는 이야기. 기억과 계절, 그리고 오래된 약속에 관한 기록을 차분한 호흡으로 따라갑니다. 샘플 줄거리입니다.'};
  if(t==='manga'){const v=3+Math.floor(rnd()*14);w.editions=[Array.from({length:v},(_,j)=>j+1)];if(k%6===0)w.editions.push(Array.from({length:Math.max(2,v-3)},(_,j)=>j+1));}
  if(t==='movie'){const s=1+Math.floor(rnd()*3);w.seasons=Array.from({length:s},(_,j)=>({n:j+1,date:`${2024-s+j+1}-04-0${j+1}`,eps:Array.from({length:8+Math.floor(rnd()*5)},(_,e)=>({n:e+1,name:`기억의 장면 ${e+1}`,min:22+Math.floor(rnd()*6)}))}));}
  if(t==='av'){w.code=`LKM-${String(101+k*7).padStart(3,'0')}`;w.people=[PEOPLE[k%6],...(k%3===0?[PEOPLE[(k+2)%6]]:[])];w.director=['김도윤','T. Mori'][k%2];w.series=k%4===0?'계절 시리즈':null;w.genres='드라마';w.status=null;}
  WORKS.push(w);}}
const cover=(w,h=600)=>art(w.i,w.type==='game'?450:w.type==='av'?430:400,h,w.type==='game'?'GAME':w.type==='movie'?'FILM':w.type==='av'?w.code:undefined);

/* ---------- state + history ---------- */
let route={type:'manga',q:'',sort:'media_date',dir:'desc',rating:'all',view:'list',work:null,edition:0,season:0,viewer:null};
let overlay=null,afterBack=null,overviewOpen=false,shown=24,showcaseOpen=false;
const scrollMemo=new Map();
const key=r=>`${r.view}|${r.type}|${r.work}|${r.q}|${r.sort}|${r.dir}|${r.rating}`;
function remember(){const sc=document.querySelector('.screen .scroller');if(sc)scrollMemo.set(key(route),sc.scrollTop);}
function go(next,{replace=false}={}){remember();route=next;if(replace)history.replaceState({route},'');else history.pushState({route},'');render(replace?null:'fwd');}
history.replaceState({route},'');
addEventListener('popstate',e=>{const s=e.state;if(!s)return;const leaving=overlay&&!s.overlay;remember();const was=route;route=s.route;overlay=s.overlay||null;
  if(leaving&&afterBack){const f=afterBack;afterBack=null;f();return;}
  render(key(was)===key(route)?null:'back');});
function openSheet(s){overlay=s;history.pushState({route,overlay},'');renderOverlay();}
function closeSheet(then){if(!overlay)return;afterBack=then||renderOverlay;history.back();}
function setRoute(patch){route={...route,...patch};history.replaceState({route},'');}

/* ---------- list data ---------- */
const SORTS={media_date:['출시·출간·개봉일',{desc:'최신순',asc:'오래된순'}],recent:['최근 추가',{desc:'최신순',asc:'오래된순'}],name:['제목',{asc:'가나다순',desc:'역순'}]};
function listFor(r){let l=WORKS.filter(w=>w.type===r.type&&(!r.q||[w.name,w.maker,w.code,...(w.people||[])].some(x=>x&&x.toLowerCase().includes(r.q.toLowerCase()))));
  if(r.rating==='unrated')l=l.filter(w=>w.score==null);else if(r.rating!=='all')l=l.filter(w=>w.score===r.rating);
  const f={media_date:w=>w.year*100-w.i,recent:w=>w.added}[r.sort];
  l.sort(f?(a,b)=>f(a)-f(b):(a,b)=>a.name.localeCompare(b.name,'ko'));if(r.dir==='desc')l.reverse();
  return l;}
const showcaseFor=t=>WORKS.filter(w=>w.type===t&&w.showcase).sort((a,b)=>a.showOrder-b.showOrder);
const starHtml=s=>`<span class="star">${ic('star')}<span class="num">${s.toFixed(1)}</span></span>`;
function workCard(w,{meta=true}={}){return `<button class="work ${w.type}" data-work="${w.id}" aria-label="${esc(w.name)}"><img class="cover" src="${cover(w)}" alt="" loading="lazy"><b>${esc(w.name)}</b><span class="credit">${esc(w.type==='av'?w.people.join(', '):w.maker)}</span>${meta?`<span class="meta"><span class="num">${w.type==='av'?w.code+' · ':''}${w.year}</span>${w.score!=null?' · '+starHtml(w.score):''}</span>`:''}</button>`;}

/* ---------- screens ---------- */
function listScreen(){const r=route;const all=listFor(r);const sc=showcaseFor(r.type);const filtered=r.q||r.rating!=='all';
  const sortLabel=`${SORTS[r.sort][0]} · ${SORTS[r.sort][1][r.dir]}`;
  const ratingLabel=r.rating==='all'?'내 별점':r.rating==='unrated'?'미평가':`★ ${r.rating.toFixed(1)}`;
  return `<div class="screen"><header class="top root"><h1>컬렉션</h1><span class="proto">시안</span></header><div class="scroller"><div class="ptr"><span>${ic('refresh')}<em>당겨서 새로고침</em></span></div>
    <div class="seg" role="tablist" aria-label="컬렉션 유형">${Object.entries(TYPES).map(([k,v])=>`<button role="tab" aria-selected="${r.type===k}" data-type="${k}">${v.label}<span class="num">${WORKS.filter(w=>w.type===k).length}</span></button>`).join('')}</div>
    <label class="find">${ic('search')}<span class="sr">작품 찾기</span><input id="q" type="search" placeholder="${r.type==='av'?'제목, 품번, 출연자 찾기':'제목이나 '+TYPES[r.type].maker+' 찾기'}" value="${esc(r.q)}" autocomplete="off">${r.q?`<button data-clearq aria-label="검색어 지우기">${ic('x')}</button>`:''}</label>
    ${!filtered&&sc.length?`<div class="section"><button class="fold" data-fold aria-expanded="${showcaseOpen}"><h2>쇼케이스<span class="num">${sc.length}</span></h2>${ic('down')}</button>${showcaseOpen?`<button class="more" data-showcase>전체 보기${ic('right')}</button>`:''}</div>${showcaseOpen?`<div class="shelf">${sc.map(w=>workCard(w,{meta:false})).join('')}</div>`:'<div style="height:14px"></div>'}`:''}
    <div class="section"><h2>${filtered?'검색 결과':'전체'}<span class="num">${all.length}</span></h2></div>
    <div class="chips" role="group" aria-label="정렬과 필터"><button class="chip" data-sheet="sort">${ic('sort')}${sortLabel}${ic('down')}</button><button class="chip ${r.rating!=='all'?'on':''}" data-sheet="rating">${ratingLabel}${ic('down')}</button>${r.rating!=='all'?'<button class="chip reset" data-reset>초기화</button>':''}</div>
    ${all.length?`<div class="grid">${all.slice(0,shown).map(w=>workCard(w)).join('')}</div>${all.length>shown?'<div class="loading" id="more">더 불러오는 중…</div>':''}`:`<div class="empty"><b>조건에 맞는 작품이 없습니다</b>검색어나 별점 조건을 바꿔 보세요.</div>`}
  </div></div>`;}
function showcaseScreen(){const sc=showcaseFor(route.type);
  return `<div class="screen"><header class="top"><button class="icon" data-back aria-label="뒤로">${ic('left')}</button><div class="titles"><span class="crumbs">컬렉션 › ${TYPES[route.type].label}</span><h1>쇼케이스 <span class="num muted" style="font-size:15px">${sc.length}</span></h1></div></header><div class="scroller"><p class="muted" style="font-size:13px;margin:2px 0 14px">PC에서 정한 순서대로 보여 줍니다.</p><div class="grid big">${sc.map(w=>workCard(w,{meta:false})).join('')}</div></div></div>`;}
function detailScreen(){const w=WORKS.find(x=>x.id===route.work);const t=TYPES[w.type];
  const facts=[w.code?`<span class="num">${w.code}</span>`:'',`<span class="num">${w.year}</span>`,w.score!=null?starHtml(w.score):'<span>미평가</span>',w.status?`<span>${w.status}</span>`:'',w.platforms?`<span>${w.platforms}</span>`:''].filter(Boolean).join('');
  let body='';
  if(w.type==='manga'){const eds=w.editions;const vols=eds[route.edition]||eds[0];
    body+=`<section class="block"><div class="section"><h2>${vols.length}권</h2></div>${eds.length>1?`<div class="editions" role="radiogroup" aria-label="판본">${eds.map((_,k)=>`<button class="chip ${route.edition===k?'on':''}" role="radio" aria-checked="${route.edition===k}" data-edition="${k}">${k===0?'기본판':'판본 '+(k+1)}</button>`).join('')}</div>`:''}
      <div class="volumes">${vols.map((v,k)=>`<button data-vol="${k}" aria-label="${v}권 표지 크게 보기"><img class="cover" src="${art(w.i+v+route.edition*3,400,600,'VOL / '+String(v).padStart(2,'0'))}" alt="" loading="lazy"><span class="num">${v}권</span></button>`).join('')}</div></section>`;}
  if(w.type==='movie'){const s=w.seasons[route.season]||w.seasons[0];
    body+=`<section class="block"><div class="section"><h2>시즌 ${w.seasons.length}개</h2></div>${w.seasons.length>1?`<div class="seasons" role="radiogroup" aria-label="시즌">${w.seasons.map((x,k)=>`<button class="season" role="radio" aria-pressed="${route.season===k}" aria-checked="${route.season===k}" data-season="${k}"><img class="cover" src="${art(w.i+k,400,600,'SEASON '+x.n)}" alt=""><b>시즌 ${x.n}</b><span class="num">${x.date} · ${x.eps.length}화</span></button>`).join('')}</div>`:''}
      <div class="episodes" aria-label="시즌 ${s.n} 회차">${s.eps.map(e=>`<div class="ep"><span class="n num">${e.n}</span><span>${e.name}</span><small class="num">${s.date} · ${e.min}분</small></div>`).join('')}</div></section>`;}
  if(w.type==='av')body+=`<section class="block"><div class="section"><h2>표지</h2></div><div class="coverset">${['앞면','책등','뒷면'].map((l,k)=>`<button class="${k===1?'spine':'face'}" data-vol="${k}" aria-label="${l} 크게 보기"><img class="cover" style="aspect-ratio:${k===1?'29/280':'5/7'}" src="${art(w.i+k,k===1?60:430,600,k===1?' ':w.code)}" alt=""><span>${l}</span></button>`).join('')}</div></section>`;
  const info=[['품번',w.code],['출연',w.people&&w.people.join(', ')],['감독',w.director],['시리즈',w.series],[t.maker,w.maker],[w.type==='game'?'배급사':'출판사',w.publisher],['장르',w.genres],['플랫폼',w.platforms],['상태',w.status],['내 별점',w.score!=null?`★ ${w.score.toFixed(1)} / 5`:'미평가']].filter(x=>x[1]);
  body+=`<section class="block"><div class="section"><h2>작품 정보</h2></div><p class="overview ${overviewOpen?'':'clamp'}">${esc(w.overview)}</p><button class="textbtn" data-overview>${overviewOpen?'접기':'더 보기'}</button><dl class="info" style="margin-top:14px">${info.map(([a,b])=>`<dt>${a}</dt><dd>${esc(b)}</dd>`).join('')}</dl></section>`;
  const backdrop=w.type!=='manga';
  return `<div class="screen"><header class="top ${backdrop?'over':''}" id="dtop"><button class="icon" data-back aria-label="뒤로">${ic('left')}</button><div class="titles"><span class="crumbs">컬렉션 › ${t.label}</span></div></header><div class="scroller" id="dscroll">
    <div class="hero" style="${backdrop?'':'padding-top:4px'}">${backdrop?`<img class="backdrop" src="${art(w.i+2,900,400,' ')}" alt=""><div class="fade"></div>`:''}<div class="intro"><img class="cover" data-vol="-1" src="${cover(w,600)}" alt="${esc(w.name)} 표지 크게 보기" role="button" tabindex="0"><div><span class="kind">${t.label}</span><h1>${esc(w.name)}</h1><span class="credit">${w.type==='av'?'출연 · '+esc(w.people.join(', ')):t.maker+' · '+esc(w.maker)}</span><div class="facts">${facts}</div></div></div></div>
    ${body}</div></div>`;}
function otherTab(name){return `<div class="screen"><header class="top root"><h1>${name}</h1></header><div class="scroller"><div class="empty">이번 시안은 컬렉션만 다룹니다.</div></div></div>`;}

/* ---------- render ---------- */
const stage=document.getElementById('stage');let tab='collections';
function render(dir){document.documentElement.style.setProperty('--gutter',(innerWidth<600?16:20)+'px');
  stage.innerHTML=tab!=='collections'?otherTab({home:'홈',library:'라이브러리',catalog:'카탈로그',notes:'노트'}[tab]):route.view==='detail'?detailScreen():route.view==='showcase'?showcaseScreen():listScreen();
  const scr=stage.querySelector('.screen');if(dir)scr.classList.add(dir);
  const sc=stage.querySelector('.scroller');sc.scrollTop=scrollMemo.get(key(route))||0;wirePull(sc);
  sc.addEventListener('scroll',()=>{const m=document.getElementById('more');if(m&&m.getBoundingClientRect().top<innerHeight+200){shown+=24;remember();render(null);}const t=document.getElementById('dtop');if(t)t.classList.toggle('solid',sc.scrollTop>120);},{passive:true});
  const q=document.getElementById('q');if(q&&window.__fq){window.__fq=false;q.focus();q.setSelectionRange(q.value.length,q.value.length);}
  document.getElementById('nav').innerHTML=[['home','Home','home'],['library','Library','photo'],['collections','Collections','stack'],['catalog','Catalog','book'],['notes','Notes','pencil']].map(([k,l,i])=>`<button data-tab="${k}" ${tab===k?'aria-current="page"':''}>${ic(i)}<span>${l}</span></button>`).join('');
  renderOverlay();}
function renderOverlay(){const o=document.getElementById('overlay');
  if(route.viewer!=null){const w=WORKS.find(x=>x.id===route.work);const list=viewerList(w);const v=list[route.viewer];
    o.innerHTML=`<div class="viewer" role="dialog" aria-label="표지 감상"><div class="vbar"><button class="icon" data-back aria-label="닫기">${ic('x')}</button><div class="grow">${esc(w.name)}<br><small class="muted num">${v.label} · ${route.viewer+1} / ${list.length}</small></div></div><div class="vimg"><img src="${v.src}" alt="${esc(v.label)}"><button class="vnav l" data-step="-1" aria-label="이전 표지">${ic('left')}</button><button class="vnav r" data-step="1" aria-label="다음 표지">${ic('right')}</button></div></div>`;wireSwipe();return;}
  if(!overlay){o.innerHTML='';return;}
  let body='';
  if(overlay==='sort')body=`<h2>정렬</h2><h3>기준</h3>${Object.entries(SORTS).map(([k,[l]])=>`<button class="opt" role="radio" aria-checked="${route.sort===k}" data-sort="${k}">${l}<span class="dot"></span></button>`).join('')}<h3>순서</h3>${Object.entries(SORTS[route.sort][1]).map(([d,l])=>`<button class="opt" role="radio" aria-checked="${route.dir===d}" data-dir="${d}">${l}<span class="dot"></span></button>`).join('')}`;
  if(overlay==='rating')body=`<h2>내 별점</h2><button class="opt" role="radio" aria-checked="${route.rating==='all'}" data-rating="all">전체<span class="dot"></span></button><button class="opt" role="radio" aria-checked="${route.rating==='unrated'}" data-rating="unrated">미평가<span class="dot"></span></button><h3>이 별점인 작품만</h3><div class="stars" role="radiogroup">${Array.from({length:11},(_,k)=>(10-k)/2).map(s=>`<button role="radio" aria-checked="${route.rating===s}" data-rating="${s}">${ic('star')}<span class="num">${s.toFixed(1)}</span></button>`).join('')}</div>`;
  o.innerHTML=`<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true"><div class="grip"></div>${body}</div></div>`;}
function viewerList(w){if(w.type==='av')return ['앞면','책등','뒷면'].map((l,k)=>({src:art(w.i+k,k===1?90:600,900,k===1?' ':w.code),label:l}));if(w.type==='manga'){const vols=w.editions[route.edition]||w.editions[0];return [{src:cover(w,900),label:'대표 표지'},...vols.map(v=>({src:art(w.i+v+route.edition*3,600,900,'VOL / '+String(v).padStart(2,'0')),label:v+'권'}))];}return [{src:cover(w,900),label:'대표 표지'}];}
function step(d){const w=WORKS.find(x=>x.id===route.work);const n=viewerList(w).length;const v=route.viewer+d;if(v<0||v>=n)return;setRoute({viewer:v});renderOverlay();}
function wireSwipe(){const v=document.querySelector('.viewer');let x0=null;v.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;},{passive:true});v.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50)step(dx<0?1:-1);});}
const pull={sc:null,y0:null,dy:0};
function wirePull(sc){pull.sc=sc.querySelector('.ptr')?sc:null;pull.y0=null;if(!pull.sc)return;
  sc.addEventListener('touchstart',e=>pS(e.touches[0].clientY),{passive:true});sc.addEventListener('touchmove',e=>pM(e.touches[0].clientY,e),{passive:false});sc.addEventListener('touchend',pE);sc.addEventListener('mousedown',e=>pS(e.clientY));}
function pS(y){if(pull.sc&&pull.sc.scrollTop<=0)pull.y0=y;}
function pM(y,e){if(pull.y0==null)return;const p=pull.sc.querySelector('.ptr');pull.dy=Math.max(0,(y-pull.y0)*.5);if(pull.dy>0&&e.cancelable)e.preventDefault();p.style.height=pull.dy+'px';p.querySelector('em').textContent=pull.dy>60?'놓으면 새로고침':'당겨서 새로고침';}
function pE(){if(pull.y0==null)return;pull.y0=null;const p=pull.sc.querySelector('.ptr'),em=p.querySelector('em');if(pull.dy>60){p.classList.add('spin');p.style.height='44px';em.textContent='새로고침 중';setTimeout(()=>{em.textContent='최신 상태입니다';p.classList.remove('spin');setTimeout(()=>{p.style.height='0';},600);},700);}else p.style.height='0';pull.dy=0;}
addEventListener('mousemove',e=>{if(pull.y0!=null&&e.buttons)pM(e.clientY,e);});addEventListener('mouseup',pE);

/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-scrim],[data-vol]');if(!t)return;const d=t.dataset;
  if(d.scrim!==undefined){if(e.target===t)closeSheet();return;}
  if(d.tab){tab=d.tab;if(tab==='collections'&&route.view!=='list'){history.go(-(route.view==='detail'&&route.viewer!=null?2:1));return;}return render(null);}
  if(d.type){if(d.type===route.type)return;shown=24;return go({...route,type:d.type,q:'',rating:'all'},{replace:true});}
  if(d.work){overviewOpen=false;return go({...route,view:'detail',work:d.work,edition:0,season:0,viewer:null});}
  if(d.fold!==undefined){showcaseOpen=!showcaseOpen;return render(null);}
  if(d.showcase!==undefined)return go({...route,view:'showcase'});
  if(d.back!==undefined)return history.back();
  if(d.sheet)return openSheet(d.sheet);
  if(d.sort)return closeSheet(()=>{const dirs=Object.keys(SORTS[d.sort][1]);shown=24;setRoute({sort:d.sort,dir:dirs.includes(route.dir)?route.dir:dirs[0]});render(null);});
  if(d.dir)return closeSheet(()=>{shown=24;setRoute({dir:d.dir});render(null);});
  if(d.rating)return closeSheet(()=>{shown=24;setRoute({rating:d.rating==='all'||d.rating==='unrated'?d.rating:Number(d.rating)});render(null);});
  if(d.reset!==undefined){setRoute({rating:'all'});return render(null);}
  if(d.clearq!==undefined){window.__fq=true;setRoute({q:''});return render(null);}
  if(d.edition){setRoute({edition:Number(d.edition)});return render(null);}
  if(d.season){setRoute({season:Number(d.season)});return render(null);}
  if(d.overview!==undefined){overviewOpen=!overviewOpen;return render(null);}
  if(d.vol!==undefined){remember();const w=WORKS.find(x=>x.id===route.work);route={...route,viewer:w.type==='av'?Math.max(0,Number(d.vol)):Number(d.vol)+1};history.pushState({route},'');return renderOverlay();}
  if(d.step)return step(Number(d.step));});
document.addEventListener('input',e=>{if(e.target.id!=='q')return;window.__fq=true;shown=24;setRoute({q:e.target.value});render(null);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(overlay||route.viewer!=null))history.back();if(route.viewer!=null&&(e.key==='ArrowRight'||e.key==='ArrowLeft'))step(e.key==='ArrowRight'?1:-1);if(e.key==='Enter'&&e.target.matches('[data-vol]'))e.target.click();});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{remember();render(null);},120);});
render(null);
</script>
</body>
</html>
