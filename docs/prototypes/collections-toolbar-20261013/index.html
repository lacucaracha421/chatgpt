<title>컬렉션 도구 줄</title>
<!-- 앱의 실제 폰트, 토큰, 공용 베이스·컨트롤·크롬, 자산 보기 메뉴(asset-view-menu), 컬렉션 화면 CSS를 불러온다.
     페이지 틀, 임시 표지, 상단 바·레일 흉내, 주석 표식, 새로 제안하는 필터 칩만 이 파일에 있다. -->

<link rel="stylesheet" href="../../../_tools/app/src/styles/tokens.css">

<style>
/* ---------- 문서 틀 (디자인 대상 아님) ---------- */
html, body, #root { height: auto !important; overflow: visible !important; overflow-y: auto !important; user-select: text; }
* { box-sizing: border-box; }
body { margin: 0; background: #0e0f10; color: var(--color-text); font: 400 var(--type-body) / 1.5 var(--font-ui); }
h1, h2, h3, p { margin: 0; }
.doc { word-break: keep-all; overflow-wrap: break-word; width: 1520px; max-width: 100%; padding: 32px 32px 96px; display: flex; flex-direction: column; gap: 48px; }
.doc > header h1 { font-size: 26px; font-weight: 600; }
.lead { color: var(--color-muted); max-width: 1100px; margin-top: 8px; line-height: 1.75; }
.lead b, .note b, .doc li b, td b { color: var(--color-text); font-weight: 600; }
.variant { display: flex; flex-direction: column; gap: 16px; padding-top: 16px; border-top: 1px solid #2a2b2d; }
.variant > h2 { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.variant > h2::before { content: ""; width: 5px; height: 5px; background: var(--color-section-mark); flex: none; }
.variant > h2 small { color: var(--color-faint); font-size: 14px; font-weight: 400; }
.rec { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 2px; background: var(--color-accent); color: var(--color-on-accent); font-size: 12px; font-weight: 600; }
.note { max-width: 1100px; color: var(--color-muted); font-size: 14px; line-height: 1.75; }
.cap { color: var(--color-faint); font-size: 13px; }
.doc ul.plain { margin: 0; padding-left: 20px; color: var(--color-muted); line-height: 1.85; max-width: 1100px; font-size: 14px; }
.pair { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; }
.pair > div { display: flex; flex-direction: column; gap: 8px; }
table.inv { border-collapse: collapse; width: 1440px; max-width: 100%; font-size: 13px; }
table.inv th, table.inv td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--color-border); line-height: 1.6; }
table.inv th { color: var(--color-faint); font-weight: 600; white-space: nowrap; }
table.inv td { color: var(--color-muted); }
table.inv td:nth-child(2) { color: var(--color-text); }
table.inv td.k { color: var(--color-text); }
table.inv td.mv { color: #d9b45a; }
.pin { display: inline-grid; place-items: center; flex: none; width: 18px; height: 18px; border-radius: 2px; background: #c9a24a; color: #1a1408; font: 700 11px/1 var(--font-ui); font-style: normal; }
table.inv .pin { margin-right: 4px; vertical-align: -3px; }

/* ---------- 화면 틀 ---------- */
.frame { position: relative; overflow: hidden; background: var(--color-bg); outline: 1px solid #2a2b2d; color: var(--color-text); font-size: var(--type-body); line-height: var(--line-ui); flex: none; }
.frame--pc { width: 1440px; height: 760px; }
.frame--pc.short { height: 300px; }
.frame--pc.mid { height: 600px; }
.frame--narrow { width: 820px; height: 220px; }
.frame--tab { width: 800px; height: 1280px; zoom: .75;
  --type-title: 22px; --type-body: 17px; --type-meta: 13px; --type-number: 28px;
  --control-height: 44px; --control-height-compact: 36px; --control-height-sm: 36px; --control-height-icon: 44px; --badge-height: 24px;
  --icon-md: 24px; --icon-sm: 16px; --line-meta: 20px; --line-ui: 24px; --text-md: 17px; --text-sm: 15px; --text-xs: 13px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.s { width: 16px; height: 16px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* PC 셸 흉내: 레일 + 상단 바(실제 앱은 workspace 헤더 슬롯) */
.pc { display: grid; grid-template-columns: 56px minmax(0, 1fr); height: 100%; }
.rail { display: flex; flex-direction: column; align-items: center; gap: var(--space-1); padding-top: var(--space-3); background: var(--color-sidebar); border-right: 1px solid var(--color-border); color: var(--color-muted); }
.rail span { display: grid; place-items: center; width: 40px; height: 40px; border-radius: var(--radius-control); }
.rail span.on { background: var(--color-selection-context); color: var(--color-selection-context-text); }
.rail .push { margin-top: auto; }
.main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { display: flex; align-items: center; gap: var(--space-2); flex: none; height: var(--toolbar-height); padding: 0 0 0 var(--space-4); border-bottom: 1px solid var(--color-border); background: var(--color-toolbar); }
.topbar .ttl { display: inline-flex; align-items: center; gap: var(--space-1); font-weight: 600; }
.topbar .ttl svg { width: 16px; height: 16px; color: var(--color-faint); }
.topbar .grow { flex: 1; }
.winctl { display: flex; align-self: stretch; align-items: center; gap: 24px; padding: 0 16px 0 12px; color: var(--color-faint); font-size: 13px; }
.status-chip { color: var(--color-faint); font-size: 12px; }
.ibtn { display: inline-grid; place-items: center; width: var(--control-height-compact); height: var(--control-height-compact); padding: 0; border: 0; border-radius: var(--radius-control); background: none; color: var(--color-muted); cursor: pointer; }
.ibtn:hover { background: var(--color-surface-hover); color: var(--color-text); }
.ibtn svg { width: 16px; height: 16px; }
.quiet-menu { display: inline-flex; align-items: center; gap: var(--space-1); height: var(--control-height-compact); padding: 0 var(--space-2); border: 0; border-radius: var(--radius-control); background: none; color: var(--color-muted); font: inherit; white-space: nowrap; cursor: pointer; }
.quiet-menu svg { width: 16px; height: 16px; }
.quiet-menu[aria-expanded="true"], .quiet-menu:hover { background: var(--color-surface-hover); color: var(--color-text); }
.count { color: var(--color-muted); font-size: var(--type-meta); font-variant-numeric: tabular-nums; }
.spine-run { display: inline-flex; align-items: center; gap: var(--space-2); color: var(--color-muted); font-size: var(--type-meta); white-space: nowrap; }
.scroll { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.ui-section-bar .ui-segmented { position: relative; }
.is-gone { opacity: .35; text-decoration: line-through; }

/* 목록 시작 줄 ('전체 184') + 새 필터 칩 */
.cb-head { display: flex; align-items: center; gap: var(--space-2); min-height: 40px; margin: 0 var(--space-6); border-top: 1px solid var(--color-border); padding-top: var(--space-2); }
.cb-head h3 { display: flex; align-items: baseline; gap: var(--space-2); font-size: var(--type-body); font-weight: 600; }
.cb-head .tot { color: var(--color-muted); font-size: var(--type-meta); font-weight: 500; font-variant-numeric: tabular-nums; }
/* 제안: 켜진 내 별점 필터를 보여 주는 칩. 회색 면 하나(얇은 요소는 단서 하나), weight 600, ✕로 바로 빼기. */
.f-chip { display: inline-flex; align-items: center; gap: var(--space-1); height: var(--control-height-compact); padding: 0 var(--space-1) 0 var(--space-2); border: 0; border-radius: var(--radius-control); background: var(--color-filter-selected); color: var(--color-filter-text, var(--color-text)); font: 600 var(--type-meta) / 1 var(--font-ui); font-variant-numeric: tabular-nums; }
.f-chip svg.star { width: 14px; height: 14px; fill: currentColor; stroke: none; color: var(--color-muted); }
.f-chip .x { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 2px; color: var(--color-muted); }
.f-chip .x svg { width: 14px; height: 14px; }
.f-chip:hover .x { color: var(--color-text); }

/* 임시 표지 (실제 라이브러리 이미지 대신) */
.cgrid { display: grid; grid-template-columns: repeat(var(--cols, 8), minmax(0, 1fr)); gap: var(--space-6) var(--space-4); padding: var(--space-4) var(--space-6) var(--space-8); }
.ccard { display: grid; gap: var(--space-2); min-width: 0; }
.cv { position: relative; display: block; aspect-ratio: 13 / 17; overflow: hidden; border-radius: var(--radius-mark); background: linear-gradient(165deg, hsl(var(--h) 42% 44%), hsl(calc(var(--h) + 30) 36% 18%)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
.cv::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255,255,255,.10), transparent 6%, transparent 94%, rgba(0,0,0,.25)); }
.ccard strong { overflow: hidden; color: var(--color-muted); font-size: var(--type-meta); font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }

/* 정적 메뉴 (실제는 Radix 포털, 버튼에 붙음). 열림/닫힘은 140ms fade + 4px rise. */
.mock-menu { position: absolute; z-index: 20; display: block; transition: opacity 140ms var(--ease-standard), transform 140ms var(--ease-standard); }
.mock-menu.is-closed { opacity: 0; transform: translateY(-4px); pointer-events: none; }
.mock-menu .ui-view-options__content { gap: var(--space-6); }
.sub { display: grid; gap: var(--space-1); }
.sub > span { color: var(--color-faint); font-size: var(--type-meta); line-height: 16px; }
.ui-view-options .ui-segmented { height: var(--control-height); }
.collection-rating-filter .ui-slider { display: flex; width: 100%; }
.collection-rating-filter .ui-slider input { width: 100%; }
.manage-row { display: flex; align-items: center; gap: var(--space-2); width: 100%; min-height: var(--control-height-menu); padding: 0 var(--space-2); border: 0; border-radius: var(--radius-control); background: transparent; color: var(--color-text); font: inherit; text-align: left; cursor: pointer; }
.manage-row:hover { background: var(--color-surface-hover); }
.manage-row svg { width: 16px; height: 16px; color: var(--color-muted); }
.manage-row .grow { flex: 1; }
.manage-row .meta { color: var(--color-faint); font-size: var(--type-meta); font-variant-numeric: tabular-nums; }
.manage-run { display: flex; align-items: center; gap: var(--space-2); min-height: var(--control-height-menu); padding: 0 var(--space-2); color: var(--color-muted); font-size: var(--type-meta); font-variant-numeric: tabular-nums; }
.manage-run .grow { flex: 1; }
.menu-solo { position: relative; }
/* 시안 전용: 앱은 창 너비 1100px 이하에서 바로가기 글자를 숨긴다(viewport 미디어 쿼리). 좁은 창 틀에서 그 상태를 재현한다. */
.frame--narrow .collection-shortcuts__label { display: none; }
.menu-solo .mock-menu { position: relative; }

/* 태블릿 흉내 */
.tab { position: absolute; inset: 0; display: flex; flex-direction: column; }
.tab-top { display: flex; align-items: center; gap: var(--space-2); flex: none; height: 56px; padding: 0 var(--space-4) 0 var(--space-6); border-bottom: 1px solid var(--color-border); background: var(--color-toolbar); }
.tab-top .ttl { font-size: var(--type-title); font-weight: 600; }
.tab-top .grow { flex: 1; }
.tab .ibtn { width: 44px; height: 44px; }
.tab .ibtn svg { width: 24px; height: 24px; }
.tab-body { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.tab-nav { display: flex; justify-content: space-around; align-items: center; flex: none; height: 64px; border-top: 1px solid var(--color-border); background: var(--color-toolbar); color: var(--color-faint); font-size: 13px; }
.tab-nav span.on { color: var(--color-text); }
.tab-bar { display: flex; align-items: center; gap: var(--space-1); padding: var(--space-2) var(--space-4) var(--space-2) var(--space-6); border-bottom: 1px solid var(--color-border); }
.tab-bar .ui-segmented { height: 44px; }
.tab-bar .ui-segmented__cell { min-width: 96px; }
.tab-bar .grow { flex: 1; }
.tab-tool { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 44px; height: 44px; padding: 0 var(--space-2); border: 0; border-radius: var(--radius-control); background: none; color: var(--color-muted); font: inherit; }
.tab-tool svg { width: 24px; height: 24px; }
.tab-tool .n { color: var(--color-accent); font-size: 13px; font-weight: 600; }
.tab-div { width: 1px; height: 20px; margin-inline: var(--space-1); background: var(--color-border); }
.tab .cb-head { margin: 0 var(--space-6); min-height: 56px; }
.tab .f-chip { height: 36px; padding-left: var(--space-3); }
.tab .f-chip .x { width: 28px; height: 28px; }
.tab .cgrid { --cols: 4; padding: var(--space-3) var(--space-6); }
.t-dim { position: absolute; inset: 0; z-index: 4; background: rgba(0,0,0,.5); }
.t-sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 8; display: grid; gap: var(--space-6); padding: var(--space-2) var(--space-6) var(--space-8); background: var(--color-surface-raised); border-top: 1px solid var(--color-border); border-radius: 8px 8px 0 0; box-shadow: var(--shadow-dialog); }
.t-sheet .grab { width: 40px; height: 4px; margin: 0 auto; border-radius: 2px; background: var(--color-border-strong); }
.t-sheet h3 { font-size: var(--type-title); font-weight: 600; }
.t-sheet .ui-segmented { height: 44px; }
.t-sheet .ui-button--secondary { min-height: 44px; }
.t-sheet .ui-per-row output, .t-sheet .collection-rating-filter__value { font-size: 15px; }
</style>
</head>

const ic = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n]}"/></svg>`;

function segmented(cells, active, extra = '') {

  <h3 style="font-size:15px;font-weight:600;margin-top:8px">책등 받기와 유형별 차이</h3>
  <div class="pair">
    <div><div class="menu-solo">${menuA({ running: true, rating: false })}</div><p class="cap">게임 · 책등 받는 중: 관리 섹션이 진행과 취소로 바뀐다.<br>"받는 중" 글자는 400ms 뒤에만 나타난다.</p></div>
    <div><div class="menu-solo">${menuA({ manga: true, rating: false })}</div><p class="cap">만화: 배치에 책장이 더해지고, 묶기와 관리는 없다.<br>영화·AV도 묶기·관리 없이 같은 모양.</p></div>
    <div style="gap:12px">
      <div class="frame" style="width:760px;height:89px"><div class="main" style="height:100%">${topA({ running: true })}${barA()}</div></div>
      <p class="cap" style="max-width:760px">게임 · 메뉴를 닫아도 실행 중인 책등 받기는 상단 바에 "책등 받는 중 12/181 · 취소"로 계속 보인다(지금과 같음, 좁아지면 숫자 → 작은 표시로 줄어듦).</p>
      <div class="frame" style="width:760px;height:52px"><div class="main" style="height:100%">${barA({ type: 1 })}</div></div>
      <p class="cap" style="max-width:760px">만화 섹션 바: 쇼케이스 · 신간 5 · 연결 점검 122 | 보기.</p>
      <div class="frame frame--narrow"><div class="main" style="height:100%">${topA()}<div class="scroll">${barA()}${head(true)}</div></div></div>
      <p class="cap" style="max-width:760px">좁은 창(820px): 바로가기는 지금 규칙대로 아이콘 + 수로 줄고, 보기는 글자를 유지한다. 메뉴가 셋에서 하나로 줄어 유형 탭이 밀리지 않는다.</p>
    </div>
  </div>
</section>

<section class="variant">
  <h2>제안 B — 쇼케이스까지 보기의 '범위'로 <small>에셋 보기의 범위(미분류/전체)와 같은 자리</small></h2>
  <div class="frame frame--pc"><div class="pc">${rail()}<div class="main">${topA()}<div class="scroll">
    <div class="ui-section-bar">${segmented(['게임', '만화', '영화', 'AV'], 0)}<div class="ui-section-bar__trailing"><div class="collection-shortcuts"><button class="ui-button ui-button--quiet ui-button--sm" type="button">${ic('cal', 's')}<span class="collection-shortcuts__label">발매 캘린더</span><span class="collection-shortcuts__count is-new num">3</span></button></div><span class="collection-shortcuts__divider"></span><button class="quiet-menu" type="button" aria-expanded="true">${ic('grid', 's')}<span>보기</span></button></div></div>
    ${head(true)}<div class="cgrid">${covers(16, 5)}</div>
    ${menuA({ style: 'right:16px; top:44px;', scope: true })}</div></div></div></div>
  <ul class="plain">
    <li>섹션 바 오른쪽이 <b>발매 캘린더 | 보기</b>로 가장 조용해진다. 보기 맨 위 <b>범위 [전체 | 쇼케이스 12]</b>가 쇼케이스를 맡는다.</li>
    <li>대신 쇼케이스가 두 번 클릭이 되고, 쇼케이스 화면에서도 보기가 떠 있어야 돌아올 수 있다(지금은 쇼케이스에서 보기가 숨음). 쇼케이스 켜기의 토글 팝 동작도 메뉴 안에서는 쓰지 않는다.</li>
    <li>2026-10-02에 쇼케이스를 섹션 바의 버튼으로 둔 결정을 되돌리는 셈이라 A를 추천한다.</li>
  </ul>
</section>

<section class="variant">
  <h2>태블릿 — 같은 보기 조각, 시트에 담김 <small>0.9.73 상단 바 하나 규칙은 그대로</small></h2>
  <div class="pair">
    ${tablet()}
    <div style="max-width:620px">
      <ul class="plain">
        <li>태블릿은 0.9.73에서 이미 정렬 · 내 별점 · 격자/선반을 <b>보기 시트 하나</b>로 합쳤다. 이번 PC 안은 그 방향을 PC로 가져오는 일이다.</li>
        <li>상단 바는 <b>제목 · 찾기 · ⋯</b> 그대로(0.9.72/0.9.73 규칙). 섹션 바도 그대로 <b>유형 | 쇼케이스 · 발매 캘린더/신간 | 보기 · +</b>.</li>
        <li>바뀌는 것은 시트 안 순서뿐이다: 지금 <b>정렬 → 내 별점 → 배치</b>를 PC와 같은 <b>내 별점 → 배치 → 정렬</b>로 맞추고, 정렬은 같은 묶기/기준/순서 세 줄을 44px 분할 컨트롤로 보인다.</li>
        <li>공유 방식(DESIGN §12): 보기 안의 섹션들(내 별점·배치·정렬)을 공용 조각 하나(<code>src/collections/</code>의 컬렉션 보기 섹션)로 만들고, PC는 <code>ViewOptionsMenu</code> 메뉴에, 태블릿은 <code>BottomSheet</code>에 담는다. 크기 차이는 크기 토큰이 맡는다. 지금 따로 있는 두 별점 슬라이더(PC <code>RatingFilter</code>, 태블릿 <code>RatingFilterSlider</code>)도 이때 하나로 합친다.</li>
        <li><b>관리(책등 받기)는 PC 전용</b>이다. 책등 받기는 PC 라이브러리 명령이라 태블릿 시트에는 섹션이 없다.</li>
        <li>켜진 내 별점 칩도 같은 조각으로 두 클라이언트 목록 첫 줄에 나온다(태블릿은 44px 터치 영역).</li>
      </ul>
    </div>
  </div>
</section>

<section class="variant">
  <h2>정할 것</h2>
  <ul class="plain">
    <li><b>1. 쇼케이스 자리</b> — A: 섹션 바 버튼 그대로(추천) / B: 보기 → 범위로.</li>
    <li><b>2. 보기 안 순서</b> — 내 별점 → 배치 → 정렬 → 관리(에셋 보기 규칙과 같음, 추천). 태블릿 시트도 이 순서로 바뀐다. 아니면 지금 태블릿처럼 정렬을 맨 위로.</li>
    <li><b>3. 켜진 내 별점 표시</b> — 목록 첫 줄 칩 + ✕(추천) / 칩 없이 보기 안에서만.</li>
    <li><b>4. 검색 버튼</b> — 돋보기 아이콘만 남기고 지금 팝오버 그대로(추천) / 태블릿처럼 찾기(Ctrl+Q) 팔레트의 "이 화면에서" 줄로 통일하고 버튼 제거.</li>
  </ul>
</section>
`;

placeThumbs();
document.querySelectorAll('.js-view').forEach(btn => btn.addEventListener('click', () => {
  const menu = btn.closest('.scroll')?.querySelector('.mock-menu');
  if (!menu) return;
  const closed = menu.classList.toggle('is-closed');
  btn.setAttribute('aria-expanded', String(!closed));
  if (!closed) placeThumbs(menu);
}));
</script>
</body>
</html>
