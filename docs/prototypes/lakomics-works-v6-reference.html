<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lakomics Works Prototype</title>
  <style>
:root {
  --color-bg: #111316;
  --color-sidebar: #181b1f;
  --color-toolbar: #1b1e22;
  --color-surface: #202328;
  --color-surface-elevated: #24282d;
  --color-surface-hover: #282c31;
  --color-selected: rgba(78, 146, 255, 0.18);
  --color-sidebar-selection: #30343a;
  --color-sidebar-hover: #23272c;
  --color-text: #e7e9ec;
  --color-muted: #8e959f;
  --color-accent: #4e8df7;
  --color-border: #2b2f35;
  --color-focus: #7db1ff;
  --color-green: #72ad7a;
  --color-warn: #d7a95b;

  --space-1: 4px;
  --space-compact: 6px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;

  --radius-tile: 2px;
  --radius-sm: 4px;
  --radius-md: 8px;

  --sidebar-width: 208px;
  --toolbar-height: 40px;
  --statusbar-height: 24px;
  --font-ui: "Segoe UI", "Noto Sans KR", sans-serif;
}

* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; }
body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-ui);
  font-size: 13px;
  overflow: hidden;
}
button, input { font: inherit; }
button { color: inherit; }

.app-shell {
  display: grid;
  grid-template-columns: var(--sidebar-width) 1fr;
  width: 100vw;
  height: 100vh;
  min-width: 920px;
  min-height: 620px;
}

.sidebar {
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--color-sidebar);
  border-right: 1px solid var(--color-border);
}

.brand-row {
  height: var(--toolbar-height);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  border-bottom: 1px solid var(--color-border);
}
.brand-mark {
  width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  background: #2d333a;
  border: 1px solid #3b424b;
  border-radius: 3px;
  font-weight: 600;
  font-size: 11px;
}
.brand-name { font-weight: 600; letter-spacing: .1px; }

.nav {
  padding: 8px 6px;
  flex: 1;
  overflow-y: auto;
}
.nav-section { display: grid; gap: 1px; }
.nav-heading {
  margin: 14px 7px 5px;
  color: #747b84;
  font-size: 11px;
}
.nav-row {
  width: 100%;
  height: 30px;
  padding: 0 8px;
  border: 0;
  border-radius: 3px;
  background: transparent;
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr) auto;
  align-items: center;
  gap: 6px;
  text-align: left;
  cursor: pointer;
}
.nav-row:hover { background: var(--color-sidebar-hover); }
.nav-row.selected {
  background: var(--color-sidebar-selection);
  box-shadow: inset 2px 0 var(--color-accent);
}
.nav-icon { color: #8c929a; text-align: center; font-size: 12px; }
.nav-count { color: #737a83; font-size: 11px; }
.sidebar-footer {
  padding: 5px 6px 7px;
  border-top: 1px solid var(--color-border);
}
.tree { display: grid; gap: 1px; }
.tree-row {
  height: 28px;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 8px;
  border-radius: 3px;
  color: #c8ccd1;
}
.tree-row:hover { background: var(--color-sidebar-hover); }
.tree-row.depth-1 { padding-left: 27px; color: #aeb4bb; }
.tree-toggle { width: 13px; color: #707780; }

.main {
  min-width: 0;
  display: grid;
  grid-template-rows: var(--toolbar-height) 1fr var(--statusbar-height);
  background: var(--color-bg);
}
.toolbar {
  display: grid;
  grid-template-columns: minmax(180px, 1fr) auto minmax(180px, 1fr);
  align-items: center;
  height: var(--toolbar-height);
  padding: 0 7px 0 10px;
  background: var(--color-toolbar);
  border-bottom: 1px solid var(--color-border);
}
.toolbar-left, .toolbar-actions, .toolbar-center {
  display: flex;
  align-items: center;
  gap: 6px;
}
.toolbar-actions { justify-content: flex-end; }
.toolbar-title { font-weight: 600; }
.toolbar-meta { color: var(--color-muted); font-size: 11px; }

.quiet-button, .primary-icon {
  width: 28px;
  height: 28px;
  border: 0;
  background: transparent;
  border-radius: 4px;
  cursor: pointer;
  display: inline-grid;
  place-items: center;
}
.quiet-button:hover { background: var(--color-surface-hover); }
.primary-icon {
  background: var(--color-accent);
  color: #fff;
}
.primary-icon:hover { filter: brightness(1.08); }

.segment {
  display: flex;
  align-items: stretch;
  height: 28px;
  border: 1px solid var(--color-border);
  border-radius: 4px;
  overflow: hidden;
}
.segment-button {
  min-width: 48px;
  padding: 0 10px;
  border: 0;
  border-right: 1px solid var(--color-border);
  background: #191c20;
  color: #aeb4bb;
  cursor: pointer;
}
.segment-button:last-child { border-right: 0; }
.segment-button:hover { background: #24282d; color: var(--color-text); }
.segment-button.active {
  background: #30343a;
  color: #f1f3f5;
}
.text-toggle {
  height: 28px;
  padding: 0 9px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: #aeb4bb;
  cursor: pointer;
}
.text-toggle:hover { background: var(--color-surface-hover); }
.text-toggle.active { background: var(--color-selected); color: #dce9ff; }

.view {
  min-height: 0;
  overflow: auto;
  display: none;
}
.active-view { display: block; }

.works-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
  gap: 12px 6px;
  align-items: start;
  padding: 8px;
}
.work-card {
  min-width: 0;
  cursor: pointer;
  outline: none;
}
.work-card:hover .work-cover { outline-color: #4d555f; }
.work-card:focus-visible .work-cover {
  outline: 2px solid var(--color-focus);
  outline-offset: -2px;
}
.work-cover {
  position: relative;
  aspect-ratio: 2 / 3;
  background: #1e2125;
  border-radius: var(--radius-tile);
  overflow: hidden;
  outline: 1px solid #262a2f;
  outline-offset: -1px;
}
.work-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.work-card.type-game .work-cover { aspect-ratio: 3 / 4; }
.work-card.type-movie .work-cover { aspect-ratio: 2 / 3; }

.work-labels { padding: 5px 2px 0; }
.work-title {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 12px;
  color: #e1e4e8;
}
.work-subtitle {
  margin-top: 2px;
  color: #7f8791;
  font-size: 11px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.badge {
  display: inline-flex;
  align-items: center;
  height: 18px;
  padding: 0 5px;
  border-radius: 3px;
  background: rgba(13,15,18,.82);
  border: 1px solid rgba(255,255,255,.12);
  color: #d7dce2;
  font-size: 10px;
}
.cover-badge {
  position: absolute;
  top: 5px;
  right: 5px;
}
.badge.new { color: #f0c77a; border-color: rgba(215,169,91,.45); }
.badge.sync { color: #9bcba1; border-color: rgba(114,173,122,.38); }

.statusbar {
  height: var(--statusbar-height);
  border-top: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 8px;
  color: #737a83;
  background: #15181b;
  font-size: 11px;
}

.detail-view { overflow: auto; }
.detail-page { min-height: 100%; }
.detail-hero {
  position: relative;
  min-height: 230px;
  border-bottom: 1px solid var(--color-border);
  background: #16191d;
  overflow: hidden;
}
.detail-hero-art {
  position: absolute;
  inset: 0 0 0 auto;
  width: 72%;
  height: 100%;
  object-fit: cover;
  opacity: .55;
}
.detail-hero-scrim {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(90deg, #14171a 0%, rgba(20,23,26,.96) 30%, rgba(20,23,26,.52) 60%, rgba(20,23,26,.18) 100%),
    linear-gradient(0deg, #14171a 0%, transparent 35%);
}
.detail-hero-content {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 118px minmax(0, 620px);
  gap: 14px;
  align-items: end;
  min-height: 230px;
  padding: 18px 20px 18px;
}
.detail-poster {
  width: 118px;
  aspect-ratio: 2/3;
  object-fit: cover;
  border: 1px solid #343a42;
  border-radius: 2px;
  background: #22262b;
}
.detail-title {
  margin: 0 0 5px;
  font-size: 20px;
  font-weight: 600;
  line-height: 1.2;
}
.detail-native-title {
  margin-bottom: 8px;
  font-size: 12px;
  color: #8d949d;
}
.detail-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 5px 10px;
  color: #b4bac1;
  font-size: 12px;
}
.detail-overview {
  margin: 10px 0 0;
  max-width: 680px;
  color: #9ea5ad;
  line-height: 1.5;
  font-size: 12px;
}

.detail-tabs {
  height: 38px;
  display: flex;
  align-items: stretch;
  gap: 2px;
  padding: 0 12px;
  border-bottom: 1px solid var(--color-border);
  background: #171a1e;
}
.detail-tab {
  position: relative;
  padding: 0 10px;
  border: 0;
  background: transparent;
  color: #9299a2;
  cursor: pointer;
}
.detail-tab:hover { color: #d5d9de; }
.detail-tab.active { color: #e8eaed; }
.detail-tab.active::after {
  content: "";
  position: absolute;
  left: 9px;
  right: 9px;
  bottom: -1px;
  height: 2px;
  background: var(--color-accent);
}

.detail-body { padding: 12px; }
.section-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 30px;
  margin-bottom: 6px;
}
.section-title { font-weight: 600; font-size: 14px; }
.section-meta { color: #7f8791; font-size: 11px; }

.asset-strip {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 6px;
}
.asset-thumb {
  aspect-ratio: 16/10;
  object-fit: cover;
  width: 100%;
  border-radius: 2px;
  outline: 1px solid #25292e;
  outline-offset: -1px;
}

.manga-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 280px;
  min-height: calc(100vh - 102px);
}
.manga-main { padding: 12px; min-width: 0; }
.info-sheet {
  border-left: 1px solid var(--color-border);
  padding: 12px;
  background: #16191d;
}
.info-sheet h3 {
  margin: 0 0 10px;
  font-size: 13px;
}
.property-list { display: grid; }
.property-row {
  display: grid;
  grid-template-columns: 84px minmax(0,1fr);
  gap: 8px;
  min-height: 28px;
  align-items: start;
  padding: 5px 0;
  border-bottom: 1px solid #24282d;
}
.property-key { color: #777f88; font-size: 11px; }
.property-value { color: #c8cdd3; font-size: 12px; line-height: 1.4; }
.sync-line {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--color-border);
  color: #7e8690;
  font-size: 11px;
  line-height: 1.6;
}
.sync-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-right: 5px;
  border-radius: 50%;
  background: var(--color-green);
  vertical-align: 1px;
}

.volume-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 12px 6px;
}
.volume-card { min-width: 0; cursor: pointer; }
.volume-cover {
  position: relative;
  aspect-ratio: 2/3;
  overflow: hidden;
  border-radius: 2px;
  background: #1d2024;
  outline: 1px solid #282d32;
  outline-offset: -1px;
}
.volume-cover img { width:100%; height:100%; display:block; object-fit:cover; }
.volume-number { margin-top: 4px; font-size: 11px; color: #d0d4d9; }
.volume-date { margin-top: 1px; font-size: 10px; color: #777f88; }
.upcoming .volume-cover { outline-color: rgba(215,169,91,.45); }

.movie-layout {
  display: grid;
  grid-template-columns: 168px minmax(0, 690px) minmax(220px, 1fr);
  gap: 16px;
  padding: 18px;
}
.movie-poster {
  width: 168px;
  border-radius: 2px;
  border: 1px solid #343a42;
}
.movie-copy h1 { margin: 0 0 4px; font-size: 21px; }
.movie-copy .original { color: #858d96; font-size: 12px; margin-bottom: 14px; }
.movie-facts { color: #b0b6bd; font-size: 12px; margin-bottom: 14px; }
.movie-copy p { color: #a0a7af; line-height: 1.58; max-width: 670px; }
.movie-backdrop {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  border-radius: 2px;
  border: 1px solid #2b3036;
}
.movie-side-label { color:#777f88; font-size:11px; margin:6px 0 10px; }

.dialog-overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(7,10,15,.78);
  display: grid;
  place-items: center;
}
.dialog-overlay.hidden, .hidden { display: none !important; }
.dialog {
  width: min(720px, calc(100vw - 48px));
  max-height: min(720px, calc(100vh - 48px));
  display: grid;
  grid-template-rows: 42px minmax(0,1fr) 48px;
  background: #202328;
  border: 1px solid #3a4047;
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(7,10,15,.82);
  overflow: hidden;
}
.dialog-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 8px 0 12px;
  border-bottom: 1px solid var(--color-border);
}
.dialog-head h2 { margin:0; font-size:14px; font-weight:600; }
.dialog-body { padding: 12px; overflow:auto; }
.dialog-foot {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 7px;
  padding: 0 10px;
  border-top: 1px solid var(--color-border);
}
.dialog-hint { margin-right:auto; color:#777f88; font-size:11px; }

.form-row {
  display: grid;
  grid-template-columns: 68px minmax(0,1fr);
  align-items: center;
  gap: 8px;
  margin-bottom: 9px;
}
.form-row > label { color:#969da5; font-size:12px; }
.search-line { display:flex; gap:6px; }
input {
  height: 28px;
  flex:1;
  min-width:0;
  padding: 0 8px;
  color: var(--color-text);
  background:#15181b;
  border:1px solid #363c43;
  border-radius:4px;
  outline:none;
}
input:focus { border-color: var(--color-focus); }
.standard-button, .emphasized-button {
  height: 28px;
  padding: 0 10px;
  border-radius: 4px;
  border: 1px solid #3b4148;
  background: #292d32;
  color: #d7dbe0;
  cursor: pointer;
}
.standard-button:hover { background:#32373d; }
.emphasized-button {
  border-color: #4e8df7;
  background: var(--color-accent);
  color: white;
}
.emphasized-button:disabled { opacity:.45; cursor:default; }
.provider-note {
  margin: 3px 0 10px 76px;
  color:#7d858e;
  font-size:11px;
}
.search-results {
  margin-left:76px;
  border-top: 1px solid var(--color-border);
}
.result-row {
  display:grid;
  grid-template-columns: 54px minmax(0,1fr) auto;
  gap:10px;
  align-items:center;
  min-height:78px;
  padding:7px 6px;
  border-bottom:1px solid var(--color-border);
  cursor:pointer;
}
.result-row:hover { background:#25292e; }
.result-row.selected { background: var(--color-selected); box-shadow: inset 2px 0 var(--color-accent); }
.result-cover {
  width:54px;
  height:64px;
  object-fit:cover;
  border-radius:2px;
  outline:1px solid #343a41;
}
.result-title { font-size:13px; font-weight:600; }
.result-meta { margin-top:3px; color:#858d96; font-size:11px; }
.result-provider { color:#6f7780; font-size:10px; }


.game-hero {
  min-height: 360px;
  background: #121519;
}
.game-hero .detail-hero-art {
  inset: 0;
  width: 100%;
  opacity: .78;
  object-position: center center;
}
.game-hero .detail-hero-scrim {
  background:
    linear-gradient(180deg, rgba(9,11,14,.18) 0%, rgba(9,11,14,.38) 38%, rgba(9,11,14,.82) 100%),
    linear-gradient(90deg, rgba(9,11,14,.82) 0%, rgba(9,11,14,.46) 42%, rgba(9,11,14,.18) 70%, rgba(9,11,14,.08) 100%);
}
.game-hero .detail-hero-content {
  grid-template-columns: minmax(0, 1fr);
  align-items: end;
  min-height: 360px;
  padding: 22px 22px 18px;
}
.game-hero .game-hero-panel {
  display: grid;
  grid-template-columns: 88px minmax(0, 1fr);
  gap: 14px;
  align-items: end;
  max-width: 720px;
}
.game-hero .detail-poster {
  width: 88px;
  box-shadow: 0 10px 22px rgba(0,0,0,.28);
}
.game-kicker {
  color: #9aa2ab;
  font-size: 11px;
  margin-bottom: 5px;
}
.game-summary-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 5px 8px;
  margin-top: 12px;
}
.game-chip {
  height: 20px;
  display: inline-flex;
  align-items: center;
  padding: 0 6px;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 3px;
  background: rgba(12,14,18,.42);
  color: #d2d7dc;
  font-size: 11px;
}
.game-sections {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 290px;
  gap: 14px;
  padding: 12px;
}
.game-side-sheet {
  border-left: 1px solid var(--color-border);
  padding-left: 14px;
}
.game-side-sheet .property-row:first-child {
  border-top: 1px solid #24282d;
}

@media (max-width: 1050px) {
  :root { --sidebar-width: 184px; }
  .toolbar { grid-template-columns: minmax(160px,1fr) auto auto; }
  .works-grid { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); }
  .manga-layout { grid-template-columns: minmax(0, 1fr) 240px; }
  .movie-layout { grid-template-columns: 145px minmax(0, 1fr); }
  .movie-poster { width:145px; }
  .movie-artwork-side { grid-column: 1 / -1; }
  .game-sections { grid-template-columns: 1fr; }
  .game-side-sheet { border-left: 0; padding-left: 0; }
  .game-hero { min-height: 300px; }
  .game-hero .detail-hero-content { min-height: 300px; }
}


/* v4: typed Work grids, date rail, Showcase, manga volume shared transition */

.works-layout {
  position: relative;
  min-height: 100%;
  padding-right: 20px;
}
.works-grid {
  padding-right: 2px;
}
.work-card.type-game .work-cover { aspect-ratio: 3 / 4; }
.work-card.type-manga .work-cover,
.work-card.type-movie .work-cover { aspect-ratio: 2 / 3; }

.work-date-rail {
  position: fixed;
  right: 2px;
  top: calc(var(--toolbar-height) + 5px);
  bottom: calc(var(--statusbar-height) + 5px);
  width: 16px;
  z-index: 8;
  cursor: ns-resize;
  user-select: none;
  touch-action: none;
}
.work-date-rail::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  right: 6px;
  width: 1px;
  background: #252a2f;
}
.work-date-line {
  position: absolute;
  right: 4px;
  width: 5px;
  height: 2px;
  background: #4b525a;
  border-radius: 1px;
  transition: width 100ms ease, background 100ms ease;
}
.work-date-line.active {
  width: 9px;
  background: #9aa2ab;
}
.work-date-label {
  position: fixed;
  right: 22px;
  top: 52px;
  z-index: 9;
  padding: 3px 6px;
  border: 1px solid #343a41;
  border-radius: 4px;
  background: rgba(18,21,25,.94);
  color: #b8bec5;
  font-size: 10px;
  pointer-events: none;
  opacity: 0;
  transform: translateY(-2px);
  transition: opacity 100ms ease, transform 100ms ease;
}
.work-date-label.visible {
  opacity: 1;
  transform: translateY(0);
}

/* Showcase */
.showcase-view {
  min-height: 100%;
  background: #111316;
}
.showcase-toolbar-note {
  color: #747c85;
  font-size: 11px;
}
.showcase-tabs {
  display: flex;
  align-items: center;
  gap: 2px;
  height: 38px;
  padding: 0 12px;
  border-bottom: 1px solid var(--color-border);
  background: #15181b;
}
.showcase-tab {
  height: 28px;
  padding: 0 10px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: #9198a0;
  cursor: pointer;
}
.showcase-tab:hover { background: #20242a; color: #d7dbe0; }

/* v5 — collectible presentation */

/* Generic dark premium game case.
   The ordinary grid keeps this quiet; detail/showcase can enable motion. */
.work-card.type-game .work-cover {
  overflow: visible;
  outline: 0;
  background: transparent;
  display: grid;
  place-items: center;
}
.work-card.type-game:hover .work-cover { outline: 0; }

.game-case-wrap {
  position: relative;
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  perspective: 900px;
}
.game-case {
  --case-spine: 8px;
  --case-tilt-x: 0deg;
  --case-tilt-y: -2.5deg;
  --case-glare-x: 50%;
  --case-glare-y: 25%;
  position: relative;
  width: calc(100% - 10px);
  height: calc(100% - 4px);
  min-width: 0;
  transform-style: preserve-3d;
  transform: rotateX(var(--case-tilt-x)) rotateY(var(--case-tilt-y));
  transform-origin: center center;
  transition: transform 110ms ease-out, filter 110ms ease-out;
  filter: drop-shadow(0 5px 6px rgba(0,0,0,.28));
}
.game-case__shell {
  position: absolute;
  inset: 0;
  border: 1px solid #3a4047;
  border-radius: 4px;
  background: rgba(20,23,27,.94);
  box-shadow:
    inset 1px 0 rgba(255,255,255,.045),
    inset -1px 0 rgba(0,0,0,.46);
  transform: translateZ(0);
}
.game-case__spine {
  position: absolute;
  left: 2px;
  top: 3px;
  bottom: 3px;
  width: var(--case-spine);
  border-right: 1px solid #424950;
  background: rgba(8,10,12,.74);
  transform: translateZ(3px);
}
.game-case__front {
  position: absolute;
  left: calc(var(--case-spine) + 4px);
  top: 3px;
  right: 3px;
  bottom: 3px;
  overflow: hidden;
  border-radius: 1px 2px 2px 1px;
  background: #15181b;
  transform: translateZ(4px);
}
.game-case__front img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}
.game-case__edge {
  position: absolute;
  right: -3px;
  top: 5px;
  bottom: 5px;
  width: 4px;
  border-radius: 0 2px 2px 0;
  background: #0d0f12;
  border-right: 1px solid #333941;
  transform: rotateY(90deg);
  transform-origin: left center;
  opacity: .88;
}
.game-case__gloss,
.collectible-glare {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .22;
  background:
    radial-gradient(circle at var(--case-glare-x) var(--case-glare-y),
      rgba(255,255,255,.33) 0,
      rgba(255,255,255,.11) 17%,
      rgba(255,255,255,0) 42%);
  mix-blend-mode: screen;
}
.game-case__rim {
  position: absolute;
  inset: 1px;
  pointer-events: none;
  border: 1px solid rgba(255,255,255,.035);
  border-radius: 3px;
}
.game-case--interactive {
  --case-tilt-y: 0deg;
  cursor: default;
}
.game-case--interactive.tilt-active {
  transition: transform 55ms linear, filter 80ms linear;
  filter: drop-shadow(var(--tilt-shadow-x, 0px) var(--tilt-shadow-y, 9px) 12px rgba(0,0,0,.36));
}

/* Detail cover should read as a physical package, not a second artwork panel. */
.game-hero .detail-game-case {
  width: 98px;
  height: 132px;
  align-self: end;
}
.game-hero .detail-game-case .game-case {
  width: 100%;
  height: 100%;
}
.game-hero .game-hero-panel {
  grid-template-columns: 104px minmax(0, 1fr);
}

/* In the normal game library the packaging hint is subtle. */
.work-card.type-game .game-case {
  --case-spine: 7px;
}
.work-card.type-game .game-case__gloss { opacity: .10; }
.work-card.type-game .game-case__edge { width: 3px; right: -2px; }
.work-card.type-game .work-cover:hover .game-case {
  --case-tilt-y: -3.5deg;
  filter: drop-shadow(0 6px 8px rgba(0,0,0,.32));
}

/* Showcase: the game case itself is the exhibit. */
.showcase-item.game .showcase-frame {
  aspect-ratio: 5 / 4;
  display: grid;
  place-items: center;
  padding: 10px 13px 8px;
  overflow: visible;
  background: #14171a;
  outline: 1px solid #252a2f;
  perspective: 1000px;
}
.showcase-item.game .showcase-frame:hover {
  outline-color: #363d44;
}
.showcase-item.game .game-case-wrap {
  height: 100%;
  width: auto;
  aspect-ratio: 3 / 4;
}
.showcase-item.game .game-case {
  width: 100%;
  height: 100%;
}
.showcase-item.game .game-case__gloss { opacity: .26; }

/* Manga: expanded cover is a collectible viewer, not an information dialog. */
.volume-detail-overlay {
  background: rgba(7,10,15,.86);
  overflow: hidden;
}
.volume-detail-panel,
.volume-detail-copy,
.volume-detail-cover-slot,
.volume-detail-actions {
  display: none !important;
}
.manga-collectible-slot {
  position: fixed;
  left: 50%;
  top: 50%;
  width: min(42vw, 390px);
  aspect-ratio: 2 / 3;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
.manga-collectible {
  --case-tilt-x: 0deg;
  --case-tilt-y: 0deg;
  --case-glare-x: 50%;
  --case-glare-y: 25%;
  position: fixed;
  z-index: 91;
  overflow: hidden;
  border-radius: 2px;
  outline: 1px solid rgba(255,255,255,.15);
  outline-offset: -1px;
  box-shadow: 0 18px 42px rgba(0,0,0,.45);
  transform-style: preserve-3d;
  transform: perspective(1000px) rotateX(var(--case-tilt-x)) rotateY(var(--case-tilt-y)) scale(1.015);
  transition:
    left 155ms cubic-bezier(.22,.8,.24,1),
    top 155ms cubic-bezier(.22,.8,.24,1),
    width 155ms cubic-bezier(.22,.8,.24,1),
    height 155ms cubic-bezier(.22,.8,.24,1),
    transform 100ms ease-out,
    box-shadow 100ms ease-out;
  will-change: left, top, width, height, transform;
  cursor: default;
}
.manga-collectible.tilt-active {
  transition: transform 48ms linear, box-shadow 70ms linear;
  box-shadow:
    var(--tilt-shadow-x, 0px) var(--tilt-shadow-y, 18px) 34px rgba(0,0,0,.45),
    0 5px 18px rgba(0,0,0,.34);
}
.manga-collectible img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}
.manga-collectible .collectible-glare {
  opacity: .20;
}
.manga-viewer-nav {
  position: fixed;
  top: 50%;
  z-index: 92;
  width: 34px;
  height: 52px;
  margin-top: -26px;
  border: 0;
  border-radius: 4px;
  background: rgba(22,25,29,.62);
  color: #b6bdc5;
  font-size: 26px;
  cursor: pointer;
  opacity: .72;
}
.manga-viewer-nav:hover {
  background: rgba(34,38,43,.88);
  color: #eef0f2;
  opacity: 1;
}
.manga-viewer-prev { left: 18px; }
.manga-viewer-next { right: 18px; }
.manga-viewer-close {
  position: fixed;
  right: 12px;
  top: 10px;
  z-index: 92;
}
.manga-viewer-index {
  position: fixed;
  left: 50%;
  bottom: 14px;
  z-index: 92;
  transform: translateX(-50%);
  color: rgba(230,233,236,.56);
  font-size: 11px;
  pointer-events: none;
}

/* Keep the viewer usable on the tablet-sized window. */
@media (max-width: 900px) {
  .manga-collectible-slot {
    width: min(53vw, 360px);
  }
  .showcase-item.game .showcase-frame {
    padding: 8px 9px 7px;
  }
}


/* v6 — floor display / physical collectible lift */

/* A quiet "floor" surface: not a shelf, not a card wrapper. */
.collectible-floor {
  position: relative;
  min-height: 100%;
  isolation: isolate;
}
.collectible-floor::before {
  content: "";
  position: absolute;
  z-index: -2;
  inset: 28% 0 0;
  background:
    linear-gradient(180deg, rgba(255,255,255,.010), rgba(255,255,255,.022) 42%, rgba(0,0,0,.06)),
    #121518;
  border-top: 1px solid rgba(255,255,255,.025);
}
.collectible-floor::after {
  content: "";
  position: absolute;
  z-index: -1;
  left: 8%;
  right: 8%;
  bottom: 4%;
  height: 18%;
  background: radial-gradient(ellipse at center, rgba(0,0,0,.25), rgba(0,0,0,0) 70%);
  filter: blur(18px);
  pointer-events: none;
}

/* Physical item base. */
.floor-object {
  --lift-y: 0px;
  --lift-rotate-y: 0deg;
  --lift-rotate-x: 1.5deg;
  position: relative;
  transform-style: preserve-3d;
  transform:
    perspective(950px)
    translateY(var(--lift-y))
    rotateX(var(--lift-rotate-x))
    rotateY(var(--lift-rotate-y));
  transform-origin: center 88%;
  transition:
    transform 155ms cubic-bezier(.2,.72,.22,1),
    filter 155ms ease-out;
  will-change: transform;
}

/* Contact shadow directly underneath the collectible. */
.floor-object::after {
  content: "";
  position: absolute;
  z-index: -1;
  left: 12%;
  right: 12%;
  bottom: -10px;
  height: 15px;
  border-radius: 50%;
  background: rgba(0,0,0,.32);
  filter: blur(7px);
  transform: scaleX(.96);
  opacity: .72;
  transition:
    bottom 155ms cubic-bezier(.2,.72,.22,1),
    height 155ms ease,
    filter 155ms ease,
    opacity 155ms ease,
    transform 155ms ease;
  pointer-events: none;
}

/* A lifted object feels detached from the floor. */
.floor-object.lifted {
  --lift-y: -15px;
  --lift-rotate-y: -5deg;
  --lift-rotate-x: 0deg;
  filter: drop-shadow(0 13px 15px rgba(0,0,0,.24));
}
.floor-object.lifted::after {
  bottom: -23px;
  height: 21px;
  filter: blur(10px);
  opacity: .52;
  transform: scaleX(1.12);
}

/* Hover is only a hint. Click/press is the real lift. */
@media (hover:hover) and (pointer:fine) {
  .floor-object:not(.lifted):hover {
    --lift-y: -3px;
    --lift-rotate-y: -1.5deg;
  }
  .floor-object:not(.lifted):hover::after {
    bottom: -13px;
    opacity: .64;
  }
}

/* Works grid: game package gets a physical floor hint without sacrificing density. */
.work-card.type-game .work-cover {
  padding: 3px 4px 7px;
}
.work-card.type-game .floor-object {
  width: 100%;
  height: 100%;
}
.work-card.type-game .floor-object::after {
  bottom: -5px;
  left: 17%;
  right: 17%;
  height: 9px;
  filter: blur(5px);
  opacity: .5;
}

/* Showcase gets a real exhibition surface. */
.showcase-stage {
  position: relative;
  overflow: hidden;
}
.showcase-stage.collectible-floor {
  padding-top: 18px;
  padding-bottom: 30px;
}
.showcase-stage.collectible-floor::before {
  inset: 18% -16px -18px;
}
.showcase-wall {
  position: relative;
  z-index: 1;
  align-items: end;
}

/* Showcase items are no longer "cards"; the item stands over its own shadow. */
.showcase-item.game .showcase-frame,
.showcase-item.manga .showcase-frame {
  overflow: visible;
  background: transparent;
  outline: 0;
  padding-bottom: 13px;
}
.showcase-item.game:hover .showcase-frame,
.showcase-item.manga:hover .showcase-frame {
  outline: 0;
}
.showcase-item.game .floor-object,
.showcase-item.manga .floor-object {
  width: 100%;
}
.showcase-item.game .game-case-wrap {
  width: 73%;
  max-width: 150px;
  margin: 0 auto;
}
.showcase-item.manga .floor-object {
  width: 78%;
  max-width: 148px;
  margin: 0 auto;
}
.showcase-item.manga .floor-object > img {
  display: block;
  width: 100%;
  aspect-ratio: 2 / 3;
  object-fit: cover;
  border-radius: 2px;
  outline: 1px solid #2d3238;
  outline-offset: -1px;
}

/* Movie remains poster-oriented; don't force every medium into the same object language. */

/* Game detail: the package is sitting in front of the hero artwork. */
.game-hero .detail-game-case {
  position: relative;
  padding-bottom: 10px;
}
.game-hero .detail-game-case.floor-object::after {
  left: 9%;
  right: 9%;
  bottom: -3px;
  height: 12px;
  opacity: .62;
}

/* Manga volume grid: covers sit quietly above the page/floor. */
.volume-grid {
  padding: 2px 2px 10px;
}
.volume-card {
  padding: 1px 1px 7px;
}
.volume-card .volume-floor-object {
  width: 100%;
}
.volume-card .volume-floor-object::after {
  left: 13%;
  right: 13%;
  bottom: -5px;
  height: 8px;
  filter: blur(5px);
  opacity: .44;
}
.volume-card .volume-floor-object .volume-cover {
  width: 100%;
}

/* The expanded manga cover gets a deeper free-floating shadow. */
.manga-collectible {
  box-shadow:
    0 22px 46px rgba(0,0,0,.42),
    0 6px 18px rgba(0,0,0,.28);
}
.manga-collectible::after {
  content: "";
  position: fixed;
  z-index: -1;
  left: 13%;
  right: 13%;
  bottom: -31px;
  height: 25px;
  border-radius: 50%;
  background: rgba(0,0,0,.35);
  filter: blur(12px);
  pointer-events: none;
}

/* Click lift animation hook used before navigation/opening. */
.floor-object.click-lift {
  --lift-y: -18px;
  --lift-rotate-y: -6deg;
  --lift-rotate-x: 0deg;
  filter: drop-shadow(0 14px 16px rgba(0,0,0,.27));
}
.floor-object.click-lift::after {
  bottom: -25px;
  height: 22px;
  filter: blur(11px);
  opacity: .5;
  transform: scaleX(1.15);
}

@media (max-width: 900px) {
  .showcase-item.game .game-case-wrap,
  .showcase-item.manga .floor-object {
    width: 84%;
  }
}

function floorObjectMarkup(innerHtml, extraClass = "") {
  return `<div class="floor-object ${extraClass}">${innerHtml}</div>`;
}

function playObjectLift(element, callback, delay = 150) {
  if (!element) {
    callback?.();
    return;
  }
  if (element.dataset.liftLock === "true") return;
  element.dataset.liftLock = "true";
  element.classList.add("click-lift");
  window.setTimeout(() => {
    callback?.();
    window.setTimeout(() => {
      element.classList.remove("click-lift");
      delete element.dataset.liftLock;
    }, 110);
  }, delay);
}

function gameCaseMarkup(work, extraClass = "", interactive = false) {
  return `
    <div class="game-case-wrap ${extraClass}">
      <div class="game-case ${interactive ? "game-case--interactive" : ""}">
        <div class="game-case__shell"></div>
        <div class="game-case__spine"></div>
        <div class="game-case__front">
          <img src="${work.cover}" alt="">
          <span class="game-case__gloss"></span>
        </div>
        <div class="game-case__edge"></div>
        <span class="game-case__rim"></span>
      </div>
    </div>`;
}

function bindTiltSurface(element, maxX = 7, maxY = 9) {
  if (!element || element.dataset.tiltBound === "true") return;
  element.dataset.tiltBound = "true";
  let active = false;

  const target = element.classList.contains("game-case") || element.classList.contains("manga-collectible")
    ? element
    : element.querySelector(".game-case") || element;

  const update = (clientX, clientY) => {
    const rect = target.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const nx = Math.max(-1, Math.min(1, ((clientX - rect.left) / rect.width) * 2 - 1));
    const ny = Math.max(-1, Math.min(1, ((clientY - rect.top) / rect.height) * 2 - 1));

    target.style.setProperty("--case-tilt-x", `${(-ny * maxX).toFixed(2)}deg`);
    target.style.setProperty("--case-tilt-y", `${(nx * maxY).toFixed(2)}deg`);
    target.style.setProperty("--case-glare-x", `${((nx + 1) * 50).toFixed(1)}%`);
    target.style.setProperty("--case-glare-y", `${((ny + 1) * 50).toFixed(1)}%`);
    target.style.setProperty("--tilt-shadow-x", `${(-nx * 10).toFixed(1)}px`);
    target.style.setProperty("--tilt-shadow-y", `${(10 + ny * 6).toFixed(1)}px`);
    target.classList.add("tilt-active");
  };

  const reset = () => {
    active = false;
    target.style.setProperty("--case-tilt-x", "0deg");
    target.style.setProperty("--case-tilt-y", "0deg");
    target.style.setProperty("--case-glare-x", "50%");
    target.style.setProperty("--case-glare-y", "25%");
    target.classList.remove("tilt-active");
  };

  element.addEventListener("pointerenter", e => {
    if (e.pointerType === "mouse" || e.pointerType === "pen") update(e.clientX, e.clientY);
  });
  element.addEventListener("pointermove", e => {
    if (e.pointerType === "mouse" || e.pointerType === "pen" || active) update(e.clientX, e.clientY);
  });
  element.addEventListener("pointerleave", reset);
  element.addEventListener("pointerdown", e => {
    active = true;
    if (element.setPointerCapture) {
      try { element.setPointerCapture(e.pointerId); } catch {}
    }
    update(e.clientX, e.clientY);
  });
  element.addEventListener("pointerup", reset);
  element.addEventListener("pointercancel", reset);
}

function renderWorks() {
  const filtered = works
    .filter(w => w.type === currentFilter)
    .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

  worksGrid.innerHTML = filtered.map(w => `
    <article class="work-card type-${w.type}" tabindex="0" data-id="${w.id}" data-created-at="${w.createdAt}">
      <div class="work-cover">
        ${w.type === "game"
          ? floorObjectMarkup(gameCaseMarkup(w), "library-game-object")
          : `<img src="${w.cover}" alt="">`}
        ${w.badge ? `<span class="badge cover-badge ${w.badge === "NEW" ? "new" : "sync"}">${w.badge}</span>` : ""}
      </div>
      <div class="work-labels">
        <div class="work-title">${w.title}</div>
        <div class="work-subtitle">${w.sub}</div>
      </div>
    </article>
  `).join("");

  worksGrid.querySelectorAll(".work-card").forEach(card => {
    const open = () => {
      const object = card.querySelector(".floor-object");
      if (object) {
        playObjectLift(object, () => openDetail(card.dataset.id), 135);
      } else {
        openDetail(card.dataset.id);
      }
    };
    card.addEventListener("click", open);
    card.addEventListener("keydown", e => { if (e.key === "Enter") open(); });
  });

  toolbarMeta.textContent = filtered.length;
  statusText.textContent = `${typeLabel(currentFilter)} ${filtered.length}개`;
  requestAnimationFrame(() => renderDateRail(filtered));
}

function typeLabel(type) {
  return type === "game" ? "게임" : type === "manga" ? "만화" : "영화";
}

function renderDateRail(filtered) {
  if (!workDateRail) return;
  workDateRail.innerHTML = "";
  if (filtered.length === 0) return;

  const uniqueDates = [...new Set(filtered.map(w => w.createdAt))];
  uniqueDates.forEach((date, index) => {
    const line = document.createElement("span");
    line.className = "work-date-line";
    line.dataset.date = date;
    const top = uniqueDates.length === 1 ? 50 : (index / (uniqueDates.length - 1)) * 94 + 3;
    line.style.top = `${top}%`;
    workDateRail.appendChild(line);
  });
  updateDateRailActive();
}

function updateDateRailActive() {
  const cards = [...worksGrid.querySelectorAll(".work-card")];
  if (!cards.length) return;
  const viewRect = worksView.getBoundingClientRect();
  let closest = cards[0];
  let best = Infinity;
  for (const card of cards) {
    const rect = card.getBoundingClientRect();
    const d = Math.abs(rect.top - viewRect.top - 12);
    if (d < best) { best = d; closest = card; }
  }
  const date = closest.dataset.createdAt;
  workDateRail.querySelectorAll(".work-date-line").forEach(line => {
    line.classList.toggle("active", line.dataset.date === date);
  });
  if (workDateLabel) {
    workDateLabel.textContent = formatShortDate(date);
    workDateLabel.classList.add("visible");
    clearTimeout(updateDateRailActive._timer);
    updateDateRailActive._timer = setTimeout(() => workDateLabel.classList.remove("visible"), 650);
  }
}

function formatShortDate(date) {
  const d = new Date(date);
  if (Number.isNaN(d.getTime())) return date;
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
}

function scrollWorksFromRail(clientY) {
  const rect = workDateRail.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));
  worksView.scrollTop = ratio * Math.max(0, worksView.scrollHeight - worksView.clientHeight);
}

if (workDateRail) {
  workDateRail.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    workDateRail.setPointerCapture(e.pointerId);
    scrollWorksFromRail(e.clientY);
  });
  workDateRail.addEventListener("pointermove", e => {
    if (workDateRail.hasPointerCapture(e.pointerId)) scrollWorksFromRail(e.clientY);
  });
}
worksView.addEventListener("scroll", updateDateRailActive, { passive: true });

      if (object) playObjectLift(object, () => openDetail(item.dataset.id), 145);
      else openDetail(item.dataset.id);
    });
  });
  if (showcaseType === "game") {
    showcaseView.querySelectorAll(".showcase-game-case").forEach(el => bindTiltSurface(el, 7, 10));
  }
}

function openVolumeDetail(card, work) {
  if (document.querySelector(".volume-detail-overlay")) return;

  const cards = [...detailView.querySelectorAll(".volume-card")];
  let currentCard = card;
  let currentIndex = Math.max(0, cards.indexOf(card));
  let closing = false;

  const coverFor = target => target?.querySelector(".volume-cover");
  const imageFor = target => coverFor(target)?.querySelector("img");
  const firstCover = coverFor(currentCard);
  const firstImage = imageFor(currentCard);
  if (!firstCover || !firstImage) return;

  const overlay = document.createElement("div");
  overlay.className = "volume-detail-overlay";
  overlay.innerHTML = `
    <button type="button" class="quiet-button manga-viewer-close" aria-label="닫기">×</button>
    <button type="button" class="manga-viewer-nav manga-viewer-prev" aria-label="이전 권">‹</button>
    <button type="button" class="manga-viewer-nav manga-viewer-next" aria-label="다음 권">›</button>
    <div class="manga-collectible-slot"></div>
    <div class="manga-viewer-index"></div>
  `;
  document.body.appendChild(overlay);

  const slot = overlay.querySelector(".manga-collectible-slot");
  const indexLabel = overlay.querySelector(".manga-viewer-index");

  const collectible = document.createElement("div");
  collectible.className = "manga-collectible";
  collectible.innerHTML = `
    <img src="${firstImage.src}" alt="">
    <span class="collectible-glare"></span>
  `;
  document.body.appendChild(collectible);

  function setCollectibleRect(rect, animate = true) {
    if (!animate) collectible.style.transition = "none";
    collectible.style.left = `${rect.left}px`;
    collectible.style.top = `${rect.top}px`;
    collectible.style.width = `${rect.width}px`;
    collectible.style.height = `${rect.height}px`;
    if (!animate) {
      collectible.getBoundingClientRect();
      collectible.style.transition = "";
    }
  }

  function updateIndexLabel() {
    indexLabel.textContent = `${currentIndex + 1} / ${cards.length}`;
  }

  const startRect = firstCover.getBoundingClientRect();
  setCollectibleRect(startRect, false);

  requestAnimationFrame(() => {
    overlay.classList.add("open");
    collectible.style.setProperty("--case-tilt-y", "-5deg");
    collectible.style.setProperty("--case-tilt-x", "0deg");
    const endRect = slot.getBoundingClientRect();
    setCollectibleRect(endRect, true);
    updateIndexLabel();
    setTimeout(() => {
      collectible.style.setProperty("--case-tilt-y", "0deg");
      bindTiltSurface(collectible, 7, 9);
    }, 165);
  });

  function switchVolume(nextIndex) {
    if (closing || nextIndex < 0 || nextIndex >= cards.length) return;
    currentIndex = nextIndex;
    currentCard = cards[currentIndex];
    const nextImage = imageFor(currentCard);
    if (!nextImage) return;

    collectible.style.setProperty("--case-tilt-x", "0deg");
    collectible.style.setProperty("--case-tilt-y", "0deg");
    collectible.classList.remove("tilt-active");
    collectible.querySelector("img").src = nextImage.src;
    updateIndexLabel();
  }

  function closeViewer() {
    if (closing) return;
    closing = true;
    collectible.style.setProperty("--case-tilt-x", "0deg");
    collectible.style.setProperty("--case-tilt-y", "0deg");
    collectible.classList.remove("tilt-active");
    overlay.classList.remove("open");

    const target = coverFor(currentCard) || firstCover;
    const targetRect = target.getBoundingClientRect();
    collectible.style.transition =
      "left 145ms cubic-bezier(.4,0,.6,1), top 145ms cubic-bezier(.4,0,.6,1), width 145ms cubic-bezier(.4,0,.6,1), height 145ms cubic-bezier(.4,0,.6,1), transform 80ms ease-out";
    setCollectibleRect(targetRect, true);

    setTimeout(() => {
      collectible.remove();
      overlay.remove();
      document.removeEventListener("keydown", onKey);
    }, 170);
  }

  function onKey(e) {
    if (e.key === "Escape") closeViewer();
    if (e.key === "ArrowLeft") switchVolume(currentIndex - 1);
    if (e.key === "ArrowRight") switchVolume(currentIndex + 1);
  }

  overlay.querySelector(".manga-viewer-close").addEventListener("click", closeViewer);
  overlay.querySelector(".manga-viewer-prev").addEventListener("click", e => {
    e.stopPropagation();
    switchVolume(currentIndex - 1);
  });
  overlay.querySelector(".manga-viewer-next").addEventListener("click", e => {
    e.stopPropagation();
    switchVolume(currentIndex + 1);
  });
  overlay.addEventListener("click", e => {
    if (e.target === overlay) closeViewer();
  });
  document.addEventListener("keydown", onKey);
}

}
function renderSearchResults() {
  selectedResult = null;
  createWork.disabled = true;
  searchResults.innerHTML = resultData[providerType].map((r, i) => `
    <div class="result-row" data-result="${i}">
      <img class="result-cover" src="${r.cover}" alt="">
      <div>
        <div class="result-title">${r.title}</div>
        <div class="result-meta">${r.meta}</div>
      </div>
      <div class="result-provider">${r.provider}</div>
    </div>
  `).join("");
  searchResults.querySelectorAll(".result-row").forEach(row => {
    row.addEventListener("click", () => {
      searchResults.querySelectorAll(".result-row").forEach(x => x.classList.remove("selected"));
      row.classList.add("selected");
      selectedResult = Number(row.dataset.result);
      createWork.disabled = false;
    });
  });
}
function openDialog() {
  dialog.classList.remove("hidden");
  selectedResult = null;
  providerType = "manga";
  document.querySelectorAll("[data-provider-type]").forEach(x => x.classList.toggle("active", x.dataset.providerType === "manga"));
  workSearch.value = providerDefaultQuery(providerType);
  providerNote.textContent = providerMessage(providerType);
  renderSearchResults();
  setTimeout(() => workSearch.focus(), 0);
}
function closeAddDialog() { dialog.classList.add("hidden"); }

openAddDialog.addEventListener("click", openDialog);
closeDialog.addEventListener("click", closeAddDialog);
cancelDialog.addEventListener("click", closeAddDialog);

document.addEventListener("keydown", e => { if (e.key === "Escape") closeAddDialog(); });

document.querySelectorAll("[data-provider-type]").forEach(btn => {
  btn.addEventListener("click", () => {
    providerType = btn.dataset.providerType;
    document.querySelectorAll("[data-provider-type]").forEach(x => x.classList.toggle("active", x === btn));
    workSearch.value = providerDefaultQuery(providerType);
    providerNote.textContent = providerMessage(providerType);
    renderSearchResults();
  });
});
document.getElementById("searchButton").addEventListener("click", renderSearchResults);

createWork.addEventListener("click", () => {
  if (selectedResult === null) return;
  const r = resultData[providerType][selectedResult];
  closeAddDialog();
  statusText.textContent = `${r.title} · 가져오기 미리보기 완료 (목업)`;
});
