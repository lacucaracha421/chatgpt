<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lakomics Mobile — Catalog & Notes prototype</title>
<!--
  Throwaway prototype (2026-09-23): Catalog and Notes redesigned with the same principles as
  the browse-first Library and Collections (own title bar, no sidebar, inline search,
  chips + bottom sheets, continuous scrolling, pull to refresh, full-screen detail).
  Fixture data only; no network or app code. Browser Back emulates Android Back.
-->
<style>
@font-face{font-family:"SUIT";src:url("../../../_tools/app/src/styles/fonts/SUIT-Variable.woff2") format("woff2");font-weight:100 900}
@font-face{font-family:"Barlow";src:url("../../../_tools/app/src/styles/fonts/Barlow-Regular.ttf");font-weight:400}
@font-face{font-family:"Barlow";src:url("../../../_tools/app/src/styles/fonts/Barlow-Medium.ttf");font-weight:500}
@font-face{font-family:"Barlow";src:url("../../../_tools/app/src/styles/fonts/Barlow-SemiBold.ttf");font-weight:600}
@font-face{font-family:"Rajdhani Numbers";src:url("../../../_tools/app/src/styles/fonts/Rajdhani-Medium.ttf");font-weight:500;unicode-range:U+0025,U+002B-003A}
:root{color-scheme:dark;--bg:#161718;--bar:#1a1b1c;--surface:#222324;--surface-2:#292a2b;--pressed:#343536;--text:#e7e9ec;--muted:#a0a3a5;--accent:#ddd8ca;--selected:rgba(221,216,202,.12);--chip:#383838;--chip-border:#808080;--border:#363739;--focus:#7db1ff;--danger:#e0877b;--font:"Barlow","SUIT","Segoe UI","Malgun Gothic",sans-serif;--num:"Rajdhani Numbers",var(--font);--gutter:20px;--top:60px;--nav:64px;--std:140ms;--ease:cubic-bezier(.2,0,0,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:15px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation;text-align:left}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
h1,h2,h3,p{margin:0}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.stage{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
@media (prefers-reduced-motion:no-preference){
  .screen.fwd{animation:fwd var(--std) var(--ease)}.screen.back{animation:back var(--std) var(--ease)}
  @keyframes fwd{from{opacity:.55;transform:translateX(28px)}}@keyframes back{from{opacity:.55;transform:translateX(-28px)}}
}
.top{height:var(--top);min-height:var(--top);display:flex;align-items:center;gap:6px;padding:0 calc(var(--gutter) - 10px);background:var(--bg);position:relative;z-index:3}
.top.root{padding-left:var(--gutter)}
.top h1{font-size:22px;font-weight:600;display:flex;align-items:baseline;gap:8px}
.top h1 .num{font-size:15px;color:var(--muted);font-weight:500}
.top .grow{flex:1}
.top.over{position:absolute;left:0;right:0;top:0;background:transparent}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.icon{width:48px;height:48px;display:grid;place-items:center;border-radius:4px;color:var(--text);position:relative}
.icon:active{background:var(--pressed)}
.icon[aria-pressed=true]{color:var(--accent)}
.icon[aria-pressed=true] svg{fill:currentColor}
.icon .badge{position:absolute;top:10px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.proto{font-size:11px;color:var(--muted);border:1px solid var(--border);padding:2px 6px;border-radius:2px;margin-right:6px}
.scroller{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 var(--gutter) 28px;position:relative}
.ptr{position:absolute;left:0;right:0;top:0;height:0;display:flex;justify-content:center;align-items:flex-end;overflow:hidden;font-size:12px;color:var(--muted);pointer-events:none;z-index:2}
.ptr span{display:flex;gap:6px;align-items:center;padding-bottom:10px}.ptr svg{width:16px;height:16px}
.ptr.spin svg{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.banner{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:12px;background:var(--surface);border-radius:4px;font-size:13px;color:var(--muted)}
.banner svg{width:18px;height:18px}.banner.spin svg{animation:spin .8s linear infinite}
.banner b{color:var(--text);font-weight:500}

.find{display:flex;align-items:center;gap:10px;height:44px;padding:0 4px 0 12px;border:1px solid var(--border);border-radius:4px;color:var(--muted);margin:4px 0 12px}
.find input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text)}
.find input::placeholder{color:var(--muted)}
.find button{width:36px;height:36px;display:grid;place-items:center}
.find button svg{width:18px;height:18px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:-6px calc(-1*var(--gutter)) 6px;padding:6px var(--gutter) 14px;scrollbar-width:none;position:sticky;top:-6px;background:var(--bg);z-index:1}
.chips-wrap{position:sticky;top:-6px;z-index:1}
.chips-wrap::after{content:"";position:absolute;left:calc(-1*var(--gutter));right:calc(-1*var(--gutter));top:100%;height:14px;margin-top:-6px;background:linear-gradient(var(--bg),rgba(22,23,24,0));pointer-events:none}
.chips-wrap .chips{position:static}
.chip{height:36px;padding:0 10px 0 14px;border:1px solid var(--border);border-radius:18px;display:flex;align-items:center;gap:4px;white-space:nowrap;font-size:14px;flex-shrink:0}
.chip svg{width:16px;height:16px;color:var(--muted)}
.chip.plain{padding:0 14px}
.chip.on{background:var(--chip);border-color:var(--chip-border)}
.chip.on svg{color:var(--text)}
.chip .count{font-family:var(--num);background:var(--accent);color:#161718;border-radius:9px;min-width:18px;height:18px;display:grid;place-items:center;font-size:12px;padding:0 5px;margin-left:2px}
.query{display:flex;align-items:center;gap:8px;margin:-4px 0 14px;font-size:13px;color:var(--muted)}
.query b{color:var(--text);font-weight:500}
.query button{text-decoration:underline;text-underline-offset:3px}

/* Catalog grid */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 12px}
@media (min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:1100px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.work{display:flex;flex-direction:column;min-width:0}
.work:active .frame{opacity:.8}
.frame{position:relative;border-radius:2px;overflow:hidden;background:var(--surface)}
.cover{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.pages{position:absolute;right:6px;bottom:6px;font-size:12px;background:rgba(7,10,15,.72);padding:1px 6px;border-radius:2px}
.versions{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(7,10,15,.72);padding:1px 6px;border-radius:2px;color:var(--accent)}
.saved{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(7,10,15,.72);display:grid;place-items:center}
.saved svg{width:15px;height:15px;fill:currentColor;stroke:none}
.work b{font-weight:500;font-size:14px;line-height:1.35;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.work .credit{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.loading{padding:20px 0;text-align:center;color:var(--muted);font-size:13px}
.empty{padding:56px 0;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}

/* Catalog detail */
.hero{position:relative;margin:0 calc(-1*var(--gutter));padding:calc(var(--top) + 8px) var(--gutter) 0}
.hero .backdrop{position:absolute;inset:0 0 auto 0;height:260px;width:100%;object-fit:cover;opacity:.45;filter:blur(18px);transform:scale(1.15)}
.hero .fade{position:absolute;inset:0 0 auto 0;height:261px;background:linear-gradient(to bottom,rgba(22,23,24,.3),var(--bg))}
.intro{position:relative;display:flex;gap:18px;align-items:flex-end}
.intro .frame{width:136px;flex-shrink:0}
@media (min-width:700px){.intro .frame{width:180px}}
.intro h1{font-size:22px;line-height:1.3;font-weight:600;text-wrap:balance}
.intro .alt{font-size:13px;color:var(--muted);margin-top:4px}
.intro .credit{font-size:14px;margin-top:8px}
.facts{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);margin-top:6px}
.actions{display:flex;gap:8px;margin-top:20px}
.btn{height:48px;border-radius:4px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;font-weight:500;border:1px solid var(--border)}
.btn.primary{flex:1;background:var(--accent);color:#161718;border-color:var(--accent);font-weight:600}
.btn.primary small{font-weight:500;opacity:.75}
.btn[aria-pressed=true]{color:var(--accent);border-color:var(--chip-border)}
.btn[aria-pressed=true] svg{fill:currentColor}
.btn:active{opacity:.8}
@media (min-width:700px){.actions{max-width:420px}}
.block{margin-top:26px}
.block h2{font-size:15px;font-weight:600;margin-bottom:10px;display:flex;align-items:baseline;gap:6px}
.block h2 .num{color:var(--muted);font-weight:500;font-size:14px}
.tags{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:start}
.tags dt{font-size:12px;color:var(--muted);padding-top:8px;white-space:nowrap}
.tags dd{margin:0;display:flex;flex-wrap:wrap;gap:6px}
.tag{height:32px;padding:0 12px;border-radius:16px;background:var(--surface);font-size:13px;display:flex;align-items:center}
.tag:active{background:var(--pressed)}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.editions{display:flex;gap:12px;overflow-x:auto;margin:0 calc(-1*var(--gutter));padding:0 var(--gutter) 4px;scrollbar-width:none}
.edition{width:112px;flex-shrink:0;padding:4px;border-radius:4px}
.edition[aria-current=true]{background:var(--selected)}
.edition b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;font-weight:500;margin-top:6px}
.edition span{font-size:12px;color:var(--muted)}

/* Notes */
.seg{display:flex;gap:4px;padding:4px;background:var(--surface);border-radius:4px;margin:0 0 18px}
.seg button{flex:1;height:40px;border-radius:2px;color:var(--muted);font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button .num{font-size:13px;opacity:.8}
.seg button[aria-selected=true]{background:var(--surface-2);color:var(--text)}
.label{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em;margin:4px 0 8px;display:flex;align-items:center;gap:6px}
.label svg{width:14px;height:14px}
.notes{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:22px}
@media (min-width:700px){.notes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.notes{grid-template-columns:repeat(3,minmax(0,1fr))}}
.note{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:6px;background:var(--surface);min-height:96px}
.note:active{background:var(--pressed)}
.note b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note b.untitled{color:var(--muted);font-weight:500}
.note p{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}
.note small{font-size:12px;color:var(--muted);margin-top:auto;padding-top:4px;display:flex;gap:6px;align-items:center}
.note small .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.note small .warn{color:var(--danger)}
.fab{position:absolute;right:20px;bottom:20px;height:56px;padding:0 20px 0 16px;border-radius:16px;background:var(--accent);color:#161718;display:flex;align-items:center;gap:8px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.45);z-index:4}
.fab svg{stroke-width:2}
.fab:active{opacity:.85}
.trashnote{font-size:12px;color:var(--muted);margin:4px 0 14px}
.top h1.sub{font-size:18px}
.trashlink{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 4px;font-size:13px;color:var(--muted)}
.trashlink svg{width:16px;height:16px}
.trashlink:active{color:var(--text)}

/* Editor */
.editor{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 var(--gutter) 16px;overflow-y:auto}
.editor .inner{width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;flex:1}
.editor input{background:none;border:0;outline:none;font-size:24px;font-weight:600;padding:8px 0 4px}
.editor .when{font-size:12px;color:var(--muted);padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:14px}
.editor textarea{flex:1;min-height:50vh;background:none;border:0;outline:none;resize:none;font-size:16px;line-height:1.7}
.editor input::placeholder,.editor textarea::placeholder{color:var(--muted)}
.conflict{font-size:13px;padding:10px 12px;border-radius:4px;background:rgba(224,135,123,.12);color:var(--danger);margin-top:8px}
.restore{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:4px;background:var(--surface);font-size:13px;color:var(--muted);margin-top:8px}
.restore button{color:var(--text);font-weight:600;min-height:36px}

.nav{height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:center;background:var(--bar);border-top:1px solid var(--border)}
.nav button{flex:1;max-width:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);position:relative}
.nav button[aria-current=page]{color:var(--text)}
.nav button[aria-current=page]::before{content:"";position:absolute;top:0;width:28px;height:2px;background:var(--accent)}

.scrim{position:fixed;inset:0;background:rgba(7,10,15,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(560px,100%);max-height:85%;overflow-y:auto;background:var(--surface);border-radius:8px 8px 0 0;padding:8px 0 calc(12px + env(safe-area-inset-bottom))}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up var(--std) var(--ease)}@keyframes up{from{transform:translateY(40px);opacity:.6}}}
.grip{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 6px}
.sheet h2{font-size:16px;font-weight:600;padding:8px var(--gutter) 2px}
.sheet .sub{font-size:12px;color:var(--muted);padding:0 var(--gutter) 6px}
.sheet h3{font-size:12px;color:var(--muted);font-weight:500;padding:14px var(--gutter) 6px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{font-size:12px;color:var(--text);min-height:32px}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:50px;padding:0 var(--gutter)}
.opt:active{background:var(--pressed)}
.opt[aria-checked=true]{color:var(--accent);font-weight:600}
.opt .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--chip-border)}
.opt[aria-checked=true] .dot{border:5px solid var(--accent)}
.opt small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.switch{width:40px;height:24px;border-radius:12px;background:var(--pressed);position:relative;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform var(--std) var(--ease)}
[aria-checked=true] .switch{background:var(--accent)}
[aria-checked=true] .switch::after{transform:translateX(16px);background:#161718}
.cats{display:flex;flex-wrap:wrap;gap:8px;padding:0 var(--gutter)}
.cats .chip{padding:0 14px}
.addtag{display:flex;gap:8px;padding:0 var(--gutter)}
.addtag input{flex:1;min-width:0;height:42px;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:0 12px;outline:none}
.addtag button{height:42px;padding:0 14px;border:1px solid var(--border);border-radius:4px}
.excluded{display:flex;flex-wrap:wrap;gap:8px;padding:10px var(--gutter) 0}
.excluded button{height:32px;padding:0 8px 0 12px;border-radius:16px;background:var(--bg);font-size:13px;display:flex;align-items:center;gap:4px;font-family:ui-monospace,monospace}
.excluded svg{width:14px;height:14px;color:var(--muted)}
.sheetfoot{display:flex;gap:8px;padding:18px var(--gutter) 4px}
.sheetfoot .btn{flex:1}
.sheetfoot .btn.ghost{flex:0 0 auto}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 18px);transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border);padding:10px 16px;border-radius:4px;font-size:13px;z-index:30;white-space:nowrap}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage"></div>
  <nav class="nav" id="nav" aria-label="앱 영역"></nav>
</div>
<div id="overlay"></div>

function art(i,label){const p=PAL[i%4];return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450" viewBox="0 0 600 900" preserveAspectRatio="none"><rect width="600" height="900" fill="${p[0]}"/><circle cx="${180+i%3*95}" cy="210" r="85" fill="${p[3]}"/><path d="M0 520L140 320 320 620 460 410 600 530V900H0" fill="${p[2]}"/><path d="M0 660L240 470 430 680 600 580V900H0" fill="${p[1]}"/><text x="45" y="845" fill="${p[3]}" font-family="sans-serif" font-size="18" letter-spacing="6">${label}</text></svg>`);}

function filtered(){let list=works;if(cat.bookmarks)list=list.filter(w=>w.saved);if(cat.q)list=list.filter(w=>(w.title+w.artist).includes(cat.q.replace(/^.*:/,'')));if(cat.lang==='japanese')list=list.filter(w=>w.i%3!==0);return list;}
const filterCount=()=>(cat.cats?1:0)+cat.excluded.length+(cat.blocked?1:0);

/* ---------- catalog ---------- */

    <div class="scroller"><div class="ptr"><span>${ic('refresh')}<em>당겨서 새로고침</em></span></div>${refreshing}

      <button class="chip" data-sheet="lang">${LANG[cat.lang]}${ic('down')}</button>

      :`<div class="empty"><b>검색 결과가 없습니다</b>검색어나 필터를 바꿔 보세요.</div>`}

function syncedLabel(){if(cat.refreshing)return '갱신 중';const m=Math.floor((Date.now()-cat.syncedAt)/6e4);return m<1?'방금 갱신':m<60?`${m}분 전 갱신`:m<1440?`${Math.floor(m/60)}시간 전 갱신`:`${Math.floor(m/1440)}일 전 갱신`;}
setInterval(()=>{const e=document.getElementById('synced');if(e)e.textContent=syncedLabel();},30000);
function card(w){return `<button class="work" data-work="${w.id}" aria-label="${esc(w.title)}"><span class="frame"><img class="cover" src="${art(w.i,'STUDY / '+String(w.i%9+1).padStart(2,'0'))}" alt="" loading="lazy"><span class="pages num">${w.pages}p</span>${w.versions>1?`<span class="versions">판본 ${w.versions}</span>`:''}${w.saved?`<span class="saved" aria-label="북마크됨">${ic('bookmark')}</span>`:''}</span><b>${esc(w.title)}</b><span class="credit">${esc(w.artist)}</span></button>`;}

  const eds=Array.from({length:w.versions},(_,k)=>({k,title:k?`${w.title} (${['일본어 원본','무수정판','컬러판'][k-1]})`:w.title,pages:w.pages+k*2}));

    ${w.versions>1?`<section class="block"><h2>판본 <span class="num">${w.versions}</span></h2><div class="editions">${eds.map(e=>`<button class="edition" data-edition="${e.k}" aria-current="${e.k===ed}"><span class="frame"><img class="cover" src="${art(w.i+e.k,' ')}" alt=""></span><b>${esc(e.title)}</b><span class="num">${e.pages}p</span></button>`).join('')}</div></section>`:''}
    <section class="block"><h2>태그</h2><dl class="tags">${TAGS.map(([ns,vals])=>`<dt>${ns}</dt><dd>${vals.map(v=>`<button class="tag" data-tag="${esc(ns+':'+v)}">${esc(v)}</button>`).join('')}</dd>`).join('')}</dl><p class="hint">태그를 누르면 같은 태그로 검색합니다.</p></section>
    </div></div>`;
}

/* ---------- notes ---------- */
const rel=t=>{const m=(Date.now()-t)/6e4;return m<60?`${Math.max(1,Math.round(m))}분 전`:m<1440?`${Math.round(m/60)}시간 전`:m<10080?`${Math.round(m/1440)}일 전`:new Date(t).toLocaleDateString('ko-KR');};
function noteCard(n){return `<button class="note" data-note="${n.id}"><b class="${n.title?'':'untitled'}">${esc(n.title||'제목 없음')}</b><p>${esc(n.body)}</p><small>${n.conflict?'<span class="warn">충돌 사본</span> · ':''}${rel(n.at)}${n.pending?' · <span class="dot" aria-hidden="true"></span>동기화 대기':''}</small></button>`;}
function notesRoot(){
  const trashView=route.screen==='trash';
  const q=noteUi.q.toLowerCase(),vis=notes.filter(n=>n.deleted===trashView&&(n.title+n.body).toLowerCase().includes(q)).sort((a,b)=>b.at-a.at);
  const pinned=vis.filter(n=>n.pinned&&!trashView),rest=vis.filter(n=>!n.pinned||trashView);
  const trash=notes.filter(n=>n.deleted).length,pending=notes.some(n=>n.pending);
  const head=trashView
    ?`<header class="top"><button class="icon" data-act="back" aria-label="메모 목록">${ic('left')}</button><h1 class="sub">휴지통 <span class="num">${trash}</span></h1><span class="grow"></span></header>`
    :`<header class="top root"><h1>메모</h1><span class="grow"></span><span class="proto">시안</span><span class="status" role="status">${pending?'동기화 대기':'동기화됨'}</span>
    <button class="icon" data-act="sync" aria-label="메모 동기화">${ic('refresh')}</button></header>`;
  return `<div class="screen">${head}
    <div class="scroller"><div class="ptr"><span>${ic('refresh')}<em>당겨서 동기화</em></span></div>
    ${trashView?'<p class="trashnote">열어서 복원할 수 있습니다.</p>':`<form class="find" data-form="notes">${ic('search')}<input id="noteq" placeholder="메모 검색" value="${esc(noteUi.q)}" autocomplete="off"></form>`}
    ${pinned.length?`<div class="label">${ic('pin')}고정됨</div><div class="notes">${pinned.map(noteCard).join('')}</div>`:''}
    ${rest.length?`${pinned.length?'<div class="label">최근</div>':''}<div class="notes">${rest.map(noteCard).join('')}</div>`:''}
    ${!vis.length?`<div class="empty"><b>${noteUi.q&&!trashView?'찾는 메모가 없습니다':trashView?'휴지통이 비어 있습니다':'아직 메모가 없습니다'}</b>${trashView||noteUi.q?'':'아래 버튼으로 첫 메모를 써 보세요.'}</div>`:''}
    ${!trashView&&trash?`<button class="trashlink" data-act="open-trash">${ic('trash')}휴지통 <span class="num">${trash}</span></button>`:''}
    <div style="height:72px"></div></div>
    ${trashView?'':`<button class="fab" data-act="new-note">${ic('plus')}새 메모</button>`}</div>`;
}
function noteEditor(){
  const n=notes.find(x=>x.id===route.id);
  return `<div class="screen"><header class="top"><button class="icon" data-act="back" aria-label="메모 목록">${ic('left')}</button><span class="grow"></span>
    <span class="status" role="status" id="savestate">${route.saving?'저장 중':'저장됨'}</span>
    ${n.deleted?'':`<button class="icon" data-act="pin" aria-pressed="${n.pinned}" aria-label="${n.pinned?'고정 해제':'고정'}">${ic('pin')}</button><button class="icon" data-act="trash" aria-label="휴지통으로">${ic('trash')}</button>`}</header>
    <div class="editor"><div class="inner">
      ${n.deleted?`<div class="restore"><span>휴지통에 있는 메모입니다.</span><button data-act="restore">복원</button></div>`:''}

      <input id="ntitle" placeholder="제목" maxlength="200" value="${esc(n.title)}" ${n.deleted?'readonly':''}>
      <p class="when">${rel(n.at)} 수정</p>

/* ---------- sheets ---------- */
function sheetHtml(s){
  if(s==='lang')return `<h2>언어</h2>${Object.entries(LANG).map(([k,v])=>`<button class="opt" role="radio" aria-checked="${cat.lang===k}" data-lang="${k}">${v}<span class="dot"></span></button>`).join('')}`;
  if(s==='sort')return `<h2>정렬</h2>${Object.entries(SORT).map(([k,v])=>`<button class="opt" role="radio" aria-checked="${cat.sort===k}" data-sort="${k}">${v}<span class="dot"></span></button>`).join('')}`;
  if(s==='filter'){const sel=new Set(cat.draftCats??ALLCATS);return `<h2>필터</h2><p class="sub">이 기기에만 적용됩니다. PC 설정은 그대로입니다.</p>
    <h3>포함할 분류 <button data-act="cats-all">${(cat.draftCats??null)===null?'모두 해제':'모두 포함'}</button></h3><div class="cats">${ALLCATS.map(c=>`<button class="chip ${sel.has(c)?'on':''}" data-cat="${c}" aria-pressed="${sel.has(c)}">${c}</button>`).join('')}</div>
    <h3>회피 태그 <span class="num">${cat.draftEx.length}</span></h3><form class="addtag" data-form="tag"><input id="tagin" placeholder="female:scat" autocapitalize="none" spellcheck="false"><button>추가</button></form>
    <div class="excluded">${cat.draftEx.map(t=>`<button data-untag="${esc(t)}" aria-label="${esc(t)} 회피 해제">${esc(t)}${ic('x')}</button>`).join('')}</div>
    <h3>차단 항목</h3><button class="opt" role="switch" aria-checked="${cat.draftBlocked}" data-act="blocked"><span>PC 공통 정책의 차단 항목 보기<small>평소에는 숨겨 둡니다.</small></span><span class="switch"></span></button>
    <div class="sheetfoot"><button class="btn ghost" data-act="filter-reset">초기화</button><button class="btn primary" data-act="filter-apply">적용</button></div>`;}
  return '';
}
function openSheet(s){if(s==='filter'){cat.draftCats=cat.cats;cat.draftEx=[...cat.excluded];cat.draftBlocked=cat.blocked;}overlay=s;history.pushState({area,route,overlay},'');renderOverlay();}
function closeSheet(){if(overlay)history.back();}
function renderOverlay(){const o=document.getElementById('overlay');if(!overlay){o.innerHTML='';return;}o.innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grip"></div>${sheetHtml(overlay)}</div></div>`;}

/* ---------- navigation ---------- */
function go(next){scrollMemo[key()]=document.querySelector('.scroller')?.scrollTop||0;route=next;history.pushState({area,route},'');render('fwd');}
const key=()=>area+':'+route.screen+':'+(route.id||'');
addEventListener('popstate',e=>{const s=e.state;if(!s)return;if(overlay&&!s.overlay){overlay=null;renderOverlay();return;}scrollMemo[key()]=document.querySelector('.scroller')?.scrollTop||0;area=s.area;route=s.route;overlay=s.overlay||null;render('back');renderOverlay();});
function render(dir){
  const stage=document.getElementById('stage');
  stage.innerHTML=area==='catalog'?(route.screen==='detail'?catalogDetail():catalogRoot()):(route.screen==='note'?noteEditor():notesRoot());
  const sc=stage.querySelector('.screen');if(dir)sc.classList.add(dir);
  const scroller=stage.querySelector('.scroller');if(scroller){scroller.scrollTop=dir==='fwd'&&route.screen!=='root'?0:(scrollMemo[key()]||0);wirePull(scroller);scroller.addEventListener('scroll',more,{passive:true});}
  document.getElementById('nav').innerHTML=[['home','Home'],['photo','Library'],['stack','Collections'],['book','Catalog','catalog'],['pencil','Notes','notes']].map(([i,l,a])=>`<button data-area="${a||''}" ${a===area?'aria-current="page"':''}>${ic(i)}${l}</button>`).join('');
}
function more(e){const sc=e.currentTarget;if(area!=='catalog'||route.screen!=='root')return;if(sc.scrollTop+sc.clientHeight>sc.scrollHeight-400&&cat.shown<filtered().length&&!cat.loading){cat.loading=true;setTimeout(()=>{const top=sc.scrollTop;cat.shown+=24;cat.loading=false;scrollMemo[key()]=top;render();},450);}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),1600);}
function reset(){cat.shown=24;scrollMemo[key()]=0;render();}

/* pull to refresh */
const pull={};
function wirePull(sc){pull.sc=sc;pull.y0=null;sc.addEventListener('touchstart',e=>{if(sc.scrollTop<=0)pull.y0=e.touches[0].clientY;},{passive:true});sc.addEventListener('touchmove',e=>pM(e.touches[0].clientY,e),{passive:false});sc.addEventListener('touchend',pE);
  sc.addEventListener('mousedown',e=>{if(sc.scrollTop<=0&&!e.target.closest('button,input,textarea'))pull.y0=e.clientY;});}
addEventListener('mousemove',e=>pM(e.clientY,e));addEventListener('mouseup',pE);
function pM(y,e){if(pull.y0==null||!pull.sc)return;const p=pull.sc.querySelector('.ptr');if(!p)return;pull.dy=Math.max(0,(y-pull.y0)*.5);if(pull.dy>0&&e.cancelable)e.preventDefault();p.style.height=pull.dy+'px';p.querySelector('em').textContent=pull.dy>60?'놓으면 새로고침':(area==='notes'?'당겨서 동기화':'당겨서 새로고침');}
function pE(){if(pull.y0==null||!pull.sc)return;pull.y0=null;const p=pull.sc.querySelector('.ptr');if(!p)return;const em=p.querySelector('em');if(pull.dy>60){p.classList.add('spin');p.style.height='44px';em.textContent=area==='notes'?'동기화 중':'새로고침 중';setTimeout(()=>{em.textContent='최신 상태입니다';p.classList.remove('spin');setTimeout(()=>{p.style.height='0';},600);},700);}else p.style.height='0';pull.dy=0;}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-act=scrim]');if(!t)return;
  if(t.dataset.act==='scrim'&&e.target!==t)return;
  const d=t.dataset;
  if(d.area!==undefined){if(!d.area){toast('시안에서는 카탈로그와 메모만 볼 수 있습니다');return;}if(d.area===area&&route.screen==='root'){document.querySelector('.scroller')?.scrollTo({top:0,behavior:'smooth'});return;}scrollMemo[key()]=document.querySelector('.scroller')?.scrollTop||0;area=d.area;route={screen:'root'};history.pushState({area,route},'');render('fwd');return;}
  if(d.sheet){openSheet(d.sheet);return;}
  if(d.lang){cat.lang=d.lang;closeSheet();setTimeout(reset,0);return;}
  if(d.sort){cat.sort=d.sort;closeSheet();setTimeout(reset,0);return;}
  if(d.cat){const s=new Set(cat.draftCats??ALLCATS);s.has(d.cat)?s.delete(d.cat):s.add(d.cat);cat.draftCats=s.size===ALLCATS.length?null:[...s];renderOverlay();return;}
  if(d.untag){cat.draftEx=cat.draftEx.filter(x=>x!==d.untag);renderOverlay();return;}
  if(d.work){go({screen:'detail',id:d.work,edition:0});return;}
  if(d.edition){route={...route,edition:+d.edition};history.replaceState({area,route},'');render();return;}
  if(d.tag){cat.q=d.tag;history.back();setTimeout(()=>{cat.shown=24;scrollMemo[key()]=0;render();},0);return;}
  if(d.note){go({screen:'note',id:d.note});return;}
  switch(d.act){
    case 'scrim':closeSheet();break;
    case 'back':history.back();break;
    case 'bookmarks':cat.bookmarks=!cat.bookmarks;reset();break;
    case 'clear-q':cat.q='';reset();break;
    case 'pull-new':cat.refreshing=1;render();const tick=setInterval(()=>{cat.refreshing++;if(cat.refreshing>4){clearInterval(tick);cat.refreshing=null;cat.syncedAt=Date.now();toast('새 작품 12개를 추가했습니다');}if(route.screen==='root'&&area==='catalog')render();},900);break;
    case 'cats-all':cat.draftCats=cat.draftCats===null?[]:null;renderOverlay();break;
    case 'blocked':cat.draftBlocked=!cat.draftBlocked;renderOverlay();break;
    case 'filter-reset':cat.draftCats=null;cat.draftEx=[];cat.draftBlocked=false;renderOverlay();break;
    case 'filter-apply':cat.cats=cat.draftCats;cat.excluded=cat.draftEx;cat.blocked=cat.draftBlocked;closeSheet();setTimeout(reset,0);break;
    case 'read':toast('리더가 열립니다 (기존 화면 그대로)');break;
    case 'save':{const w=works.find(x=>x.id===route.id);w.saved=!w.saved;render();toast(w.saved?'북마크했습니다':'북마크를 해제했습니다');break;}
    case 'sync':case 'new-note':if(d.act==='sync'){notes.forEach(n=>n.pending=false);render();toast('동기화했습니다');break;}
      {const n={id:'n'+Date.now(),title:'',body:'',pinned:false,deleted:false,at:Date.now(),pending:true};notes.unshift(n);go({screen:'note',id:n.id});setTimeout(()=>document.getElementById('ntitle')?.focus(),200);}break;
    case 'open-trash':go({screen:'trash'});break;
    case 'pin':{const n=notes.find(x=>x.id===route.id);n.pinned=!n.pinned;render();break;}
    case 'trash':{const n=notes.find(x=>x.id===route.id);n.deleted=true;history.back();setTimeout(()=>toast('휴지통으로 옮겼습니다'),50);break;}
    case 'restore':{const n=notes.find(x=>x.id===route.id);n.deleted=false;render();toast('복원했습니다');break;}
  }
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.form;
  if(f==='search'){cat.q=document.getElementById('catq').value.trim();document.activeElement.blur();reset();}
  if(f==='tag'){const v=document.getElementById('tagin').value.trim().toLowerCase();if(/^[a-z][a-z0-9_-]*:.+/.test(v)&&!cat.draftEx.includes(v)){cat.draftEx.push(v);renderOverlay();document.getElementById('tagin').focus();}else toast('female:scat 형식으로 입력해 주세요');}
});
let saveTimer;
document.addEventListener('input',e=>{
  if(e.target.id==='noteq'){noteUi.q=e.target.value;const pos=e.target.selectionStart;render();const i=document.getElementById('noteq');i.focus();i.setSelectionRange(pos,pos);}
  if(e.target.id==='ntitle'||e.target.id==='nbody'){const n=notes.find(x=>x.id===route.id);n[e.target.id==='ntitle'?'title':'body']=e.target.value;n.at=Date.now();n.pending=true;const s=document.getElementById('savestate');s.textContent='저장 중';clearTimeout(saveTimer);saveTimer=setTimeout(()=>{s.textContent='저장됨';},600);}
});
const start=new URLSearchParams(location.search).get('area');if(start==='notes')area='notes';
history.replaceState({area,route},'');render();
</script>
