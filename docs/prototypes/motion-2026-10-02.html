<title>Lakomics 움직임 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600&display=swap">
<style>
/* Layout: one left-aligned column of live demos; each demo renders real-size app screens (PC 1280x800, tablet 800x1280) scaled to fit, so proportions match the app. Single dark look = the app's 먹색 theme. */
:root {
  color-scheme: dark;
  --bg: #161718;
  --sidebar: #1a1b1c;
  --surface: #222324;
  --elev: #292a2b;
  --hover: #2d2e2f;
  --pressed: #343536;
  --viewer: #070a0f;
  --text: #e7e9ec;
  --muted: #a0a3a5;
  --faint: #7d8184;
  --accent: #ddd8ca;
  --on-accent: #202628;
  --ctx: rgba(221, 216, 202, .16);
  --ctx-text: #f1eee6;
  --echo: rgba(221, 216, 202, .4);
  --mark: rgba(221, 216, 202, .6);
  --rule: linear-gradient(90deg, rgba(221, 216, 202, .3), rgba(221, 216, 202, .06));
  --border: #363739;
  --border-strong: #55585a;
  --focus: #7db1ff;
  --bezel: #0b0c0d;
  --font: "Pretendard Variable", "Pretendard", "Noto Sans KR", "Yu Gothic UI", "Segoe UI", "Malgun Gothic", sans-serif;
  --ease-standard: cubic-bezier(.2, 0, 0, 1);
  --ease-sheet: cubic-bezier(.32, .72, 0, 1);
  --ease-spring: cubic-bezier(.22, 1, .36, 1);
  --speed: 1;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body { background: var(--bg); color: var(--text); font: 15px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible + .trk { outline: 2px solid var(--focus); outline-offset: 2px; }

.page { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 32px 64px; }
@media (min-width: 900px) { .page { padding-inline: 32px; } }

.top { display: grid; gap: 12px; padding-bottom: 24px; }
.top h1 { margin: 0; font-size: 28px; line-height: 1.25; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.lede { margin: 0; max-width: 68ch; color: var(--muted); }
.lede b { color: var(--text); font-weight: 600; }
.globals { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
.toc { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; }
.toc a { color: var(--muted); text-decoration: none; }
.toc a:hover { color: var(--text); }
.legend { margin: 0; font-size: 13px; color: var(--faint); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }

/* Toggle switch: the one round control (DESIGN §12). */
.sw { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: var(--muted); font-size: 14px; user-select: none; }
.sw input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw .trk { position: relative; width: 32px; height: 18px; border-radius: 9px; background: var(--pressed); flex: none; transition: background calc(90ms * var(--speed)) var(--ease-standard); }
.sw .trk::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); transition: transform calc(140ms * var(--speed)) var(--ease-standard), background calc(90ms * var(--speed)); }
.sw input:checked + .trk { background: var(--accent); }
.sw input:checked + .trk::after { transform: translateX(14px); background: var(--on-accent); }
.sw input:checked ~ span:last-child { color: var(--text); }

.sec { display: grid; gap: 12px; padding-block: 32px; border-top: 1px solid var(--border); }
.sec-h h2 { margin: 0; font-size: 20px; line-height: 1.3; font-weight: 600; }
.sec-h p { margin: 4px 0 0; color: var(--muted); max-width: 72ch; }
.ctrls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; min-width: 0; }

.seg { position: relative; display: inline-flex; max-width: 100%; overflow-x: auto; padding: 2px 5px 5px 2px; background: var(--surface); border-radius: 4px; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { position: relative; z-index: 1; flex: none; height: 28px; padding: 0 12px; border: 0; border-radius: 3px; background: transparent; color: var(--muted); font-size: 14px; white-space: nowrap; cursor: pointer; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { color: var(--on-accent); font-weight: 600; }
.seg .thumb { position: absolute; top: 2px; left: 0; height: 28px; border-radius: 3px; background: var(--accent); box-shadow: 3px 3px 0 -1px var(--surface), 3px 3px 0 0 var(--echo); transition: transform calc(200ms * var(--speed)) var(--ease-standard), width calc(200ms * var(--speed)) var(--ease-standard); }

.btn { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text); font-size: 14px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn:active { background: var(--pressed); }
.btn svg { color: var(--muted); }

.curve { display: inline-flex; align-items: center; gap: 8px; min-width: 0; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.curve svg { flex: none; color: var(--muted); }

.note { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; margin: 0; max-width: 80ch; color: var(--muted); font-size: 14px; }
.badge { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 2px; background: var(--elev); color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap; }
.badge.chg { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1px var(--border-strong); }

.pair { display: grid; grid-template-columns: minmax(0, 2.5fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.solo { display: grid; grid-template-columns: minmax(0, 1fr); }
@media (max-width: 760px) {
  .pair { grid-template-columns: minmax(0, 1fr); }
  .dev-tab { max-width: 300px; }
}
.dev { display: grid; gap: 8px; min-width: 0; margin: 0; }
.dev figcaption { font-size: 12px; color: var(--faint); line-height: 1.5; }
.dev figcaption b { color: var(--muted); font-weight: 600; }
.frame { position: relative; width: 100%; overflow: hidden; background: var(--viewer); border: 1px solid var(--border); border-radius: 4px; }
.bezel { padding: 8px; border-radius: 20px; background: var(--bezel); box-shadow: 0 0 0 1px var(--border); }
.bezel .frame { border: 0; border-radius: 10px; }
.frame:focus-within { border-color: var(--focus); }
.bezel:focus-within { box-shadow: 0 0 0 1px var(--focus); }

/* ---------- Real-size app screen (scaled as a whole) ---------- */
.screen { position: absolute; left: 0; top: 0; overflow: hidden; transform-origin: 0 0; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.4; user-select: none; -webkit-user-select: none; }
.screen:focus { outline: none; }
.screen.tab { font-size: 17px; }
.app .stage { position: absolute; overflow: hidden; }
.app.pc .stage { left: 56px; top: 0; right: 0; bottom: 0; }
.app.tab .stage { left: 0; top: 56px; right: 0; bottom: 72px; }
.rail { position: absolute; left: 0; top: 0; bottom: 0; width: 56px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px; background: var(--sidebar); border-right: 1px solid var(--border); z-index: 2; }
.rail .nb { width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; transition: background calc(90ms * var(--speed)) var(--ease-standard), color calc(90ms * var(--speed)); }
.rail .nb:hover { background: var(--hover); color: var(--text); }
.rail .nb.on { background: var(--ctx); color: var(--ctx-text); }
.tbar { position: absolute; z-index: 2; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; padding: 0 24px; background: var(--bg); border-bottom: 1px solid var(--border); font-size: 22px; font-weight: 600; }
.bnav { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; height: 72px; display: flex; background: var(--sidebar); border-top: 1px solid var(--border); }
.bnav .nb { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; background: transparent; color: var(--muted); font-size: 13px; cursor: pointer; }
.bnav .nb.on { color: var(--text); font-weight: 600; }

.view { position: absolute; inset: 0; overflow: hidden; padding: 24px 16px; background: var(--bg); }
.tab .view { padding: 24px; }
.v-title { margin: 0 0 16px; font-size: 20px; font-weight: 600; line-height: 1.3; }
.tab .v-title { font-size: 22px; }
.sl { display: flex; align-items: center; gap: 8px; margin: 24px 0 8px; color: var(--faint); font-size: 12px; }
.tab .sl { font-size: 13px; }
.sl:first-child { margin-top: 0; }
.sl::before { content: ""; width: 5px; height: 5px; background: var(--mark); flex: none; }
.sl::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.home { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; }
.home.tab { grid-template-columns: minmax(0, 1fr); gap: 0; }
.home.tab > div + div { margin-top: 24px; }
.row { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-height: 48px; border-bottom: 1px solid var(--border); }
.tab .row { min-height: 64px; }
.row b, .cv b { font-weight: 400; }
.row small, .cv small { color: var(--muted); font-size: 12px; }
.tab .row small, .tab .cv small { font-size: 13px; }
.anniv { display: flex; gap: 2px; height: 120px; }
.anniv > div { height: 100%; flex: none; }
.covers { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
.tab .covers { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cv { display: grid; gap: 4px; min-width: 0; }
.cv b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cv-a { position: relative; aspect-ratio: .7; border-radius: 2px; }
.b-new { position: absolute; left: 4px; top: 4px; display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 2px; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 600; }
.dh { margin: 16px 0 8px; color: var(--muted); font-size: 12px; }
.dh:first-of-type { margin-top: 0; }
.jrow { display: flex; gap: 2px; margin-bottom: 2px; }
.t { position: relative; flex-shrink: 1; border-radius: 2px; }
.dur { position: absolute; right: 4px; bottom: 4px; display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border-radius: 2px; background: rgba(22, 23, 24, .78); color: var(--text); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.cgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 24px 16px; }
.tab .cgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.chips { display: flex; gap: 8px; margin-bottom: 16px; }
.chips span { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 4px; color: var(--muted); font-size: 13px; }
.chips span.on { background: #383838; color: #e7e7e7; font-weight: 600; }
.mas { display: flex; gap: 12px; align-items: flex-start; }
.mcol { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.mas .t { cursor: zoom-in; }

/* ---------- Viewer ---------- */
.vw { background: var(--viewer); }
.vw-img { position: absolute; }
.vw-top { position: absolute; z-index: 4; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: linear-gradient(rgba(0, 0, 0, .6), transparent); }
.vw-pos { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.vw-pos b { color: var(--text); font-weight: 600; }
.vw-title { display: flex; flex-direction: column; gap: 4px; min-width: 0; line-height: 1.2; }
.vw-title strong { font-size: 15px; font-weight: 600; }
.vw-title small { color: var(--faint); font-size: 12px; }
.sp { flex: 1; }
.vb { width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; }
.vb:hover { background: rgba(255, 255, 255, .08); color: var(--text); }
.vw-edge { position: absolute; z-index: 3; top: 56px; width: 96px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: rgba(255, 255, 255, .55); cursor: pointer; }
.vw-edge:hover { color: var(--text); background: rgba(255, 255, 255, .03); }
.vw-edge.l { left: 0; } .vw-edge.r { right: 0; }
.fs-host { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.fs-shade { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent, rgba(0, 0, 0, .62)); pointer-events: none; transition: opacity calc(260ms * var(--speed)) var(--ease-standard); }
.fs-shade.dim { opacity: .45; }
.fs { position: absolute; left: 0; right: 0; bottom: 16px; pointer-events: auto; }
.fs.grow { bottom: 12px; }
.fs-sc { position: absolute; inset: 0; transform-origin: 50% 100%; }
.fs.grow .fs-sc { transform: scale(.5); transition: transform calc(260ms * var(--speed)) var(--ease-sheet); }
.fs.grow.grown .fs-sc { transform: none; }
.fs-view { position: absolute; left: 0; right: 0; bottom: 8px; touch-action: none; cursor: grab; -webkit-mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent); mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent); }
.fs-view:active { cursor: grabbing; }
.fs-track { position: absolute; left: 0; top: 0; bottom: 0; will-change: transform; }
.fs-it { position: absolute; top: 0; border-radius: 2px; opacity: .5; transition: opacity calc(140ms * var(--speed)) var(--ease-standard); }
.fs.row .fs-it { opacity: .6; }
.fs.row .fs-it:hover { opacity: .9; }
.fs.row .fs-it.on { opacity: 1; outline: 2px solid var(--accent); outline-offset: 1px; }
.fs.ctr .fs-it.on { opacity: 1; }
.fs-v { position: absolute; left: 4px; bottom: 4px; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 2px; background: rgba(22, 23, 24, .78); color: var(--text); }
.fs-slot { position: absolute; left: 50%; bottom: 2px; width: 0; pointer-events: none; }
.fs-slot i { position: absolute; top: 0; bottom: 0; width: 12px; border: 2px solid var(--accent); transition: transform calc(140ms * var(--speed)) var(--ease-standard); }
.fs-slot .l { right: 0; border-right: 0; }
.fs-slot .r { left: 0; border-left: 0; }
.fs-cur { position: absolute; left: 0; right: 0; bottom: 0; height: 88px; display: flex; align-items: center; justify-content: center; gap: 4px; padding: 0 16px; background: linear-gradient(transparent, rgba(0, 0, 0, .55)); pointer-events: auto; }
.fc-it { position: relative; flex: none; overflow: hidden; border-radius: 2px; opacity: .55; cursor: pointer; }
.fc-it.on { opacity: 1; outline: 2px solid var(--accent); outline-offset: 1px; }
.fc-it > div { position: absolute; }
.vw-gbtn { position: absolute; z-index: 3; right: 16px; bottom: 16px; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 0; border-radius: 4px; background: rgba(22, 23, 24, .72); color: var(--text); font-size: 15px; cursor: pointer; }
.vw-gbtn:hover { background: rgba(45, 46, 47, .9); }
.vw-gbtn kbd { font: inherit; font-size: 12px; color: var(--faint); }
.tab .vw-gbtn { right: auto; left: 50%; bottom: 24px; height: 44px; padding: 0 16px; font-size: 17px; transform: translateX(-50%); }
.vw-grid { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; background: rgba(7, 10, 15, .94); }
.vg-head { flex: none; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px 0 24px; font-weight: 600; }
.vg-head .vw-pos { font-weight: 400; }
.vg-body { position: relative; flex: 1; overflow: auto; padding: 0 24px 24px; scrollbar-width: thin; }
.vg-row { display: flex; gap: 8px; margin-bottom: 8px; }
.vg-it { flex-shrink: 1; border-radius: 2px; cursor: pointer; opacity: .85; }
.vg-it:hover { opacity: 1; }
.vg-it.on { opacity: 1; outline: 2px solid var(--accent); outline-offset: 2px; }

/* Shared-element zoom */
.zv { position: absolute; inset: 0; z-index: 6; }
.zv-bg { position: absolute; inset: 0; background: var(--viewer); }
.zv-img { position: absolute; transform-origin: 0 0; will-change: transform; }

/* ---------- Video ---------- */
.vd { background: #000; }
.vd-pic { position: absolute; overflow: hidden; cursor: pointer; }
.vd-flow { position: absolute; left: -50%; top: -50%; width: 200%; height: 200%; animation: vflow 14s linear infinite alternate; animation-play-state: paused; }
.vd-blob { position: absolute; left: 30%; top: 34%; width: 38%; aspect-ratio: 1; border-radius: 50%; animation: vblob 4.6s ease-in-out infinite alternate; animation-play-state: paused; }
.vd.playing .vd-flow, .vd.playing .vd-blob { animation-play-state: running; }
@keyframes vflow { from { transform: translate(0, 0) rotate(0deg); } to { transform: translate(14%, 9%) rotate(28deg); } }
@keyframes vblob { to { transform: translate(34%, -22%) scale(1.3); } }
.vd-top { position: absolute; z-index: 3; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: linear-gradient(rgba(0, 0, 0, .6), transparent); }
.vd-chrome { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 12px; padding: 72px 24px 16px; background: linear-gradient(transparent, rgba(7, 10, 15, .8) 48%); }
.vd-strip { position: relative; height: 84px; }
.tab .vd-strip { height: 96px; }
.vd-strip > div { position: absolute; top: 0; height: 100%; border-radius: 2px; opacity: .5; }
.vd-strip > div.on { opacity: 1; }
.vd-strip .fs-slot { bottom: -6px; top: -6px; }
.vd-bar { display: flex; align-items: center; gap: 12px; height: 40px; }
.vd-time { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.vd-track { position: relative; flex: 1; height: 6px; border-radius: 1px; background: rgba(255, 255, 255, .2); overflow: hidden; }
.vd-fill { position: absolute; inset: 0; background: var(--text); transform-origin: 0 50%; transform: scaleX(0); }
.vd .vd-chrome, .vd .vd-top { transition: transform calc(260ms * var(--speed)) var(--ease-sheet), opacity calc(260ms * var(--speed)) var(--ease-sheet); }
.vd.hid .vd-chrome, .vd.hid .vd-top { transition-duration: calc(200ms * var(--speed)); transition-timing-function: var(--ease-standard); pointer-events: none; }
.vd.hid .vd-chrome { transform: translateY(100%); }
.vd.hid .vd-top { transform: translateY(-100%); }
.vd.m-cur .vd-strip { display: none; }
.vd.m-cur .vd-chrome, .vd.m-cur .vd-top { transition: opacity calc(140ms * var(--speed)) var(--ease-standard); }
.vd.m-cur.hid .vd-chrome, .vd.m-cur.hid .vd-top { transform: none; opacity: 0; }
.vd-strip { transition: transform calc(200ms * var(--speed)) var(--ease-standard), opacity calc(200ms * var(--speed)) var(--ease-standard); }
.vd.m-B.playing .vd-strip { transform: translateY(24px); opacity: 0; pointer-events: none; }
.vd.hid { cursor: none; }

/* ---------- Shelf ---------- */
.shelf { position: relative; border: 1px solid var(--border); border-radius: 4px; background: var(--sidebar); overflow: hidden; cursor: default; }
.shelf-row { display: flex; align-items: flex-end; gap: 32px; padding: 64px 40px 0; overflow-x: auto; scrollbar-width: thin; }
.shelf-board { height: 32px; border-top: 1px solid var(--border-strong); background: linear-gradient(var(--surface), var(--sidebar)); }
.case { --fh: clamp(128px, 15vw, 190px); --W: calc(var(--fh) * var(--r)); --d: max(8px, calc(var(--fh) * .08)); --lead: calc(var(--d) * .6); position: relative; flex: none; width: calc(var(--W) * .86 + var(--d)); height: calc(var(--fh) + 4px); padding: 0; border: 0; background: none; perspective: 480px; perspective-origin: 35% 30%; cursor: pointer; }
.case::after { content: ""; position: absolute; left: var(--lead); bottom: -3px; width: calc(var(--W) * 1.02); height: 10px; border-radius: 50%; background: rgba(0, 0, 0, .85); filter: blur(5px); transform-origin: 50% 50%; transition: opacity var(--cdur, 200ms) var(--cease, var(--ease-standard)), transform var(--cdur, 200ms) var(--cease, var(--ease-standard)); }
.case.front, .case.settling { z-index: 2; }
.case.front::after { opacity: .45; transform: translateX(calc(var(--lead) * -1)) scaleX(1.08); }
.case:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }
.box { position: absolute; z-index: 1; left: var(--lead); bottom: 0; width: var(--W); height: var(--fh); transform-style: preserve-3d; transform-origin: 0 100%; transform: rotateX(-6deg) rotateY(34deg); transition: transform var(--cdur, 200ms) var(--cease, var(--ease-standard)); }
.case.front .box { transform: translateX(calc(var(--lead) * -1)) translateY(-6px) translateZ(34px) rotateX(0deg) rotateY(0deg); }
.box > i { position: absolute; display: block; overflow: hidden; backface-visibility: hidden; background: linear-gradient(var(--plastic), var(--plastic)), #1b1c1e; }
.box .cf { inset: 0; border-radius: 3px 6px 6px 3px; }
.box .cf b { position: absolute; inset: 3px 3px 3px 0; border-radius: 0 2px 2px 0; }

/* App shell with an area rail (PC) or bottom navigation (tablet). New views wait hidden until "ready" (90 ms) while the old one stays. */
function Shell(scr, kind, opts = {}) {
  const mode = opts.mode || (() => 'cur');
  const make = opts.make || viewFor;
  scr.classList.add('app');
  const stage = el('div', 'stage'); let tbar = null;
  const btns = TABS.map((t, ix) => {
    const b = el('button', 'nb', kind === 'pc' ? icon(t.ic, 20) : icon(t.ic, 24) + `<span>${t.l}</span>`);
    b.type = 'button'; b.setAttribute('aria-label', t.l);
    if (opts.noNav) b.tabIndex = -1; else b.addEventListener('click', () => api.go(ix));
    return b;
  });
  if (kind === 'pc') { const rail = el('nav', 'rail'); rail.append(...btns); scr.append(rail, stage); }
  else { tbar = el('div', 'tbar'); const nav = el('nav', 'bnav'); nav.append(...btns); scr.append(tbar, stage, nav); }
  let cur = opts.initial || 0, shown = make(TABS[cur].k, kind), pending = null, token = 0;
  stage.append(shown);
  const mark = () => { btns.forEach((b, ix) => b.classList.toggle('on', ix === cur)); if (tbar) tbar.textContent = TABS[cur].l; };
  mark();
  const api = {
    stage,
    get view() { return shown; },
    async go(ix) {
      if (ix === cur) return;
      const dir = ix > cur ? 1 : -1; cur = ix; mark();
      const my = ++token;
      stage.getAnimations({ subtree: true }).forEach(a => a.finish());
      stage.querySelectorAll('.leaving').forEach(v => v.remove());
      if (pending) { pending.remove(); pending = null; }
      const nv = make(TABS[ix].k, kind); nv.style.visibility = 'hidden'; stage.append(nv); pending = nv; shown.inert = true;
      await wait(90);
      if (my !== token) return;
      pending = null; nv.style.visibility = '';
      const old = shown; shown = nv; old.classList.add('leaving');
      const m = mode();
      if (m === 'cur' || RM) { old.remove(); return; }
      if (m === 'A') {
        play(nv, [{ opacity: 0 }, { opacity: 1 }], 160, 'std').onfinish = () => old.remove();
        play(nv, [{ transform: 'translateY(12px)' }, { transform: 'none' }], 380, 'sheet');
      } else if (m === 'B') {
        play(old, [{ transform: 'none', opacity: 1 }, { transform: `translateX(${-28 * dir}px) scale(.98)`, opacity: 0 }], 200, 'std', { fill: 'forwards' }).onfinish = () => old.remove();
        play(nv, [{ transform: `translateX(${28 * dir}px) scale(.98)`, opacity: 0 }, { transform: 'none', opacity: 1 }], 320, 'sheet');
      } else {
        old.remove();
        play(nv, [{ transform: 'translateY(8px)' }, { transform: 'none' }], 200, 'std');
      }
    },
    async firstLoad(fn) {
      const my = ++token;
      stage.getAnimations({ subtree: true }).forEach(a => a.cancel());
      if (pending) { pending.remove(); pending = null; }
      stage.querySelectorAll('.view').forEach(v => v.remove());
      await waitS(280);
      if (my !== token) return;
      shown = make(TABS[cur].k, kind); stage.append(shown);
      if (fn) fn(shown);
    }
  };
  return api;
}
