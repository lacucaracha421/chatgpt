name: Deploy Lakomics Mobile

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "extension/**"
      - ".github/workflows/mobile-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lakomics-mobile-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build Pages bundle
        run: |
          rm -rf _site
          mkdir -p _site/downloads
          cp -R mobile/. _site/
          cd extension
          zip -r ../_site/downloads/lakomics-extension-latest.zip . \
            -x "*.DS_Store" "__MACOSX/*" "node_modules/*" "tests/*" "*.zip"

      - name: Upload mobile prototype
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
