<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>분류 창 테스트</title><style>body{margin:0;background:#202123;color:#d7d3b9;font:14px 'Segoe UI',sans-serif;min-height:100vh;display:grid;place-content:center}button{padding:12px 24px;border:1px solid #aaa68f;background:#d7d3b9;color:#4b493e;cursor:pointer}output{text-align:center;margin:20px}small{text-align:center;color:#aaa68f;margin:10px}</style><button id="open">분류 열기</button><small>테스트 · 실제 저장 없음</small><output></output><script src="src/layout.js"></script><script src="src/list-collector.js?v=single"></script><script>
const names=['아르고스','레굴루스','소네트','드루비스','릴리아','메디슨 포켓','보이저','센츄리온','안안 리','이터니티','멜라니아','피클즈','투스 페어리','제시카','갈라보나','샤먼','식스','스파토데아','에즈라','곡랑','게티안','이졸데','마커스','빌라','윈드송','루시','카카니아'];
const entries=[{id:'game',name:'게임',parentId:null},{id:'manga',name:'만화',parentId:null},{id:'reverse',name:'리버스',parentId:'game'},{id:'zenless',name:'젠레스',parentId:'game'},...names.map((name,i)=>({id:'tag'+i,name,parentId:'reverse'}))];
function openMenu(){LakomicsListCollector.mount({entries,layout:LakomicsRadial.resetLayout(entries),pinnedIds:[],hiddenIds:[],origin:{x:innerWidth/2-191,y:innerHeight/2-125},onSave:async id=>{await new Promise(resolve=>setTimeout(resolve,350));document.querySelector('output').textContent=entries.find(e=>e.id===id).name+' · 저장 테스트';return {ok:true}},onClose(){}})}
document.querySelector('#open').onclick=openMenu;openMenu();
</script></html>
