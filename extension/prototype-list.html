<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lakomics — 목록 분류 프로토타입</title>
<style>
@font-face{font-family:SUIT;src:url('options/fonts/SUIT-Variable.woff2')}@font-face{font-family:Barlow;src:url('options/fonts/Barlow-Regular.ttf')}
:root{--paper:#cbc8af;--panel:#dedac0;--ink:#4b493e;--muted:#7b7867;--line:#aaa68e;--row:#b8b49c;--font:Barlow,SUIT,'Segoe UI',sans-serif;color:var(--ink);background:var(--paper);font:15px/1.4 var(--font)}*{box-sizing:border-box}body{margin:0;min-height:100svh}body:before,body:after{content:'';position:fixed;border:1px solid #aba78f;border-radius:50%;width:1100px;height:1100px;pointer-events:none;z-index:-1}body:before{left:-740px;top:-630px;box-shadow:0 0 0 8px var(--paper),0 0 0 9px #b1ad95}body:after{right:-880px;bottom:-870px;box-shadow:0 0 0 9px var(--paper),0 0 0 10px #b1ad95}button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:0}button:focus-visible{outline:2px solid var(--ink);outline-offset:4px}header{height:76px;margin:0 32px;border-bottom:2px solid var(--ink);display:flex;align-items:center;justify-content:space-between;position:relative}header:after{content:'';position:absolute;left:0;right:0;bottom:-9px;height:4px;background:radial-gradient(circle,var(--ink) 1px,transparent 1.6px) 0 0/22px 4px}.brand{font-size:20px;letter-spacing:.16em;display:flex;align-items:center;gap:12px}.brand:before{content:'';width:15px;height:15px;background:var(--ink)}.prototype{font-size:11px;letter-spacing:.08em;color:var(--muted)}main{width:min(960px,calc(100% - 64px));margin:48px auto}h1{font-size:38px;line-height:1.1;font-weight:400;letter-spacing:.04em;margin:0 0 36px}h1 span{display:block;font-size:12px;letter-spacing:.13em;color:var(--muted);margin-top:10px}.workspace{display:grid;grid-template-columns:minmax(125px,.8fr) minmax(150px,1fr) minmax(210px,1.3fr);gap:30px;align-items:start}.column{min-width:0;position:relative;padding-left:14px;border-left:6px solid var(--row)}.column:before{content:'';position:absolute;left:3px;top:0;bottom:0;border-left:1px solid var(--line)}.column:nth-child(1){margin-top:50px}.column:nth-child(2){margin-top:25px}.column-head{height:32px;display:flex;justify-content:space-between;align-items:start;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:8px}.count{font-variant-numeric:tabular-nums}.rows{display:flex;flex-direction:column;gap:7px;max-height:min(410px,calc(100svh - 300px));min-height:200px;overflow-y:auto;padding:4px 7px 4px 0;scrollbar-width:thin;scrollbar-color:var(--ink) transparent}.row{position:relative;flex-shrink:0;display:flex;align-items:center;gap:10px;width:100%;min-height:41px;text-align:left;background:transparent;padding:8px 11px;transition:background-color 90ms;color:var(--ink)}.row:before{content:'';width:12px;height:12px;background:var(--ink);flex:none}.row .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .arrow{margin-left:auto;opacity:.65}.row:hover{background:var(--row)}.row.selected{background:var(--ink);color:var(--panel);box-shadow:0 3px 0 #aaa68e}.row.selected:before{background:var(--panel)}.row.selected:after{content:'';position:absolute;left:0;right:0;top:-4px;border-top:1px solid var(--ink)}.column:last-child .rows{background:var(--panel);padding:10px;min-height:300px;border-bottom:2px solid var(--line)}.column:last-child .column-head{background:var(--ink);color:var(--panel);padding:7px 10px;height:32px;margin:0;border:0}.footer{margin-top:35px;border-left:6px solid var(--ink);background:var(--panel);min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 16px;position:relative}.footer:before{content:'';position:absolute;left:4px;top:0;bottom:0;border-left:1px solid var(--ink)}#path{font-size:14px;overflow-wrap:anywhere}.save{background:var(--ink);color:var(--panel);min-height:40px;padding:8px 18px;white-space:nowrap}.save:disabled{opacity:.4;cursor:default}.hint{display:flex;gap:16px;justify-content:flex-end;font-size:11px;margin-top:14px;color:var(--muted)}kbd{font:inherit;color:var(--panel);background:var(--ink);padding:1px 4px;margin-right:4px}.mobile-path{display:none}.reopen{padding:12px 24px;background:var(--ink);color:var(--panel)}[hidden]{display:none!important}#result{min-height:24px;margin-top:12px;font-size:13px}footer{margin:30px 32px 16px;padding-top:8px;border-top:1px solid var(--ink);font-size:11px;color:var(--muted)}@media(max-width:760px){.workspace{gap:16px}main{width:calc(100% - 40px);margin:32px auto}header{margin:0 20px}.row{font-size:13px;padding-inline:8px;gap:7px}.column{padding-left:10px}.brand{font-size:16px}}
@media(max-width:600px){header{height:62px}main{margin:28px auto}h1{font-size:30px;margin-bottom:24px}h1 span{display:none}.workspace{display:block}.column{margin:0!important}.column:not(.mobile-current){display:none}.rows,.column:last-child .rows{max-height:calc(100svh - 320px);min-height:210px}.row{min-height:46px;font-size:16px}.column-head{font-size:13px}.mobile-path{display:flex;gap:6px;align-items:center;margin-bottom:18px}.mobile-path button{background:transparent;padding:7px 8px;border-bottom:1px solid var(--line)}.footer{margin-top:22px}.hint{display:none}.prototype{letter-spacing:0}footer{margin:16px 20px}.brand{letter-spacing:.06em}.save{padding:8px 12px}}@media(prefers-reduced-motion:reduce){.row{transition:none}}
</style>
</head>
<body>
<!-- Throwaway prototype: can a quiet cascading list replace the radial collector? No persistence or external calls. -->
<header><div class="brand">LAKOMICS</div><div class="prototype">목록 분류 · 테스트</div></header>
<main><h1>분류</h1><button class="reopen" id="reopen" hidden>분류 열기</button><div id="picker"><nav class="mobile-path" aria-label="선택 경로" id="breadcrumb"></nav><div class="workspace" id="columns"></div><div class="footer"><div id="path" aria-live="polite"></div><button class="save" id="save">여기에 저장</button></div><div class="hint"><span><kbd>↑ ↓</kbd>선택</span><span><kbd>← →</kbd>이동</span><span><kbd>Enter</kbd>확인</span><span><kbd>Esc</kbd>닫기</span></div></div><div id="result" role="status"></div></main>
<footer>예시 분류 · 실제 파일은 저장되지 않습니다.</footer>
<script>
const reverse=['레굴루스','소네트','드루비스','릴리아','메디슨 포켓','보이저','센츄리온','안안 리','이터니티','멜라니아','피클즈','투스 페어리','제시카','갈라보나','샤먼','식스','스파토데아','에즈라','곡랑','게티안','이졸데','마커스','빌라','윈드송','루시','카카니아','머큐리아','J','튜즈데이','아르고스','안조 날라','로페라'];
const data=[{name:'게임',children:[{name:'리버스',children:reverse},{name:'젠레스',children:['엘렌','제인','미야비','니콜','주연','아스트라']},{name:'명조',children:['금희','장리','음림','카멜리아','쇼어키퍼']},{name:'니어',children:['2B','9S','A2','배경']} ]},{name:'만화',children:[{name:'작품',children:['표지','본문','설정화']},{name:'작가',children:['인터뷰','자료']}]},{name:'사진',children:[{name:'도시',children:['거리','건축','야경']},{name:'자연',children:['숲','바다','하늘']}]},{name:'자료',children:[{name:'디자인',children:['인터페이스','타이포그래피','색상']},{name:'참고',children:['구도','의상','소품']}]}];
let root=0,group=0,tag=0,mobileDepth=0;
const columns=document.querySelector('#columns'),path=document.querySelector('#path'),picker=document.querySelector('#picker');
function lists(){return [data,data[root].children,data[root].children[group].children]}
function names(){return [data[root].name,data[root].children[group].name,lists()[2][tag]]}
function choose(depth,index,advance=false){if(depth===0){root=index;group=0;tag=0}else if(depth===1){group=index;tag=0}else tag=index;mobileDepth=advance?Math.min(2,depth+1):depth;document.querySelector('#result').textContent='';render(undefined,depth+1)}
function render(focusDepth,resetFrom=3){const offsets=Array.from(columns.querySelectorAll('.rows'),e=>e.scrollTop);const values=lists(),selected=[root,group,tag];columns.replaceChildren();['분류','작품','태그'].forEach((title,depth)=>{const column=document.createElement('section');column.className='column'+(mobileDepth===depth?' mobile-current':'');column.setAttribute('aria-label',title);const heading=document.createElement('div');heading.className='column-head';heading.innerHTML='<span>'+title+'</span><span class="count">'+values[depth].length+'</span>';const rows=document.createElement('div');rows.className='rows';values[depth].forEach((entry,index)=>{const name=typeof entry==='string'?entry:entry.name;const button=document.createElement('button');button.className='row'+(selected[depth]===index?' selected':'');button.dataset.depth=depth;button.dataset.index=index;button.setAttribute('aria-pressed',String(selected[depth]===index));button.innerHTML='<span class="name"></span>'+(depth<2?'<span class="arrow" aria-hidden="true">›</span>':'');button.querySelector('.name').textContent=name;button.title=name;button.addEventListener('click',()=>choose(depth,index,true));rows.append(button)});column.append(heading,rows);columns.append(column);if(depth<resetFrom)rows.scrollTop=offsets[depth]||0});path.textContent=names().join(' / ');const crumb=document.querySelector('#breadcrumb');crumb.replaceChildren();['분류',...names().slice(0,2)].forEach((name,i)=>{if(i>mobileDepth)return;const button=document.createElement('button');button.textContent=(i?'› ':'')+name;button.onclick=()=>{mobileDepth=i;render()};crumb.append(button)});if(focusDepth!==undefined){const button=columns.querySelector('[data-depth="'+focusDepth+'"][data-index="'+selected[focusDepth]+'"]');button?.focus({preventScroll:true});button?.scrollIntoView({block:'nearest'})}}
columns.addEventListener('keydown',event=>{const button=event.target.closest('.row');if(!button)return;const depth=Number(button.dataset.depth),index=Number(button.dataset.index);if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();const next=Math.max(0,Math.min(lists()[depth].length-1,index+(event.key==='ArrowDown'?1:-1)));choose(depth,next);render(depth)}else if(event.key==='ArrowRight'||event.key==='ArrowLeft'){event.preventDefault();mobileDepth=Math.max(0,Math.min(2,depth+(event.key==='ArrowRight'?1:-1)));render(mobileDepth)}else if(event.key==='Enter'){event.preventDefault();if(depth<2){mobileDepth=depth+1;render(mobileDepth)}else save()}});
function save(){document.querySelector('#result').textContent='저장 테스트 완료 · '+names().join(' / ')}
document.querySelector('#save').onclick=save;document.addEventListener('keydown',event=>{if(event.key==='Escape'){picker.hidden=true;document.querySelector('#reopen').hidden=false;document.querySelector('#reopen').focus()}});document.querySelector('#reopen').onclick=()=>{picker.hidden=false;document.querySelector('#reopen').hidden=true;render(0)};render();
</script>
</body></html>
