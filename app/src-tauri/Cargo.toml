[package]
name = "lakomics"
version = "0.2.0"
description = "Local-first media library"
edition = "2021"
default-run = "lakomics"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled", "backup", "hooks"] }
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
sha2 = "0.11.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
webp = { version = "0.3.1", default-features = false }
pdqhash = "=0.1.1"
tauri-plugin-dialog = "2"
tiny_http = "0.12.0"
ureq = { version = "3.4.0", features = ["json"] }
url = "2"
regex = "1"
ring = "0.17.14"

tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
drag = "2.1.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libc = "0.2"
secret-service = { version = "5.2", features = ["rt-async-io-crypto-rust"] }
async-io = "2"
futures-lite = "2"

# Keep decoding and PDQ math optimized while retaining normal app debug builds.
# Version qualifiers distinguish the app image stack from pdqhash's legacy stack.
[profile.dev.package."image:0.25.10"]
opt-level = 3
[profile.dev.package."image:0.23.14"]
opt-level = 3
[profile.dev.package.pdqhash]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package."png:0.18.1"]
opt-level = 3
[profile.dev.package."gif:0.14.2"]
opt-level = 3
